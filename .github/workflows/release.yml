name: Release

on:
  workflow_dispatch:
    inputs:
      hardware_status:
        description: Status der vollständigen Prüfung auf einem realen E1001
        required: true
        default: not_tested
        type: choice
        options:
          - not_tested
          - passed
      distribution_reviewed:
        description: Lizenzstatus und Drittanbieterhinweise wurden geprüft
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify exact green main revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Require the main branch and distribution confirmation
        env:
          DISTRIBUTION_REVIEWED: ${{ inputs.distribution_reviewed }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$DISTRIBUTION_REVIEWED" = "true"

      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate metadata and derive the version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/release_preflight.py --print-version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require this exact main revision to be green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"

          green_runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f per_page=100 \
            --jq "[.workflow_runs[] | select(
              .head_sha == \"$GITHUB_SHA\" and
              .head_branch == \"main\" and
              .head_repository.full_name == \"$GITHUB_REPOSITORY\" and
              .conclusion == \"success\"
            )] | length")
          test "$green_runs" -ge 1

      - name: Reject conflicting tags or an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if tag_sha=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}"); then
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          if release_check=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1); then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          elif ! grep -q "HTTP 404" <<<"$release_check"; then
            echo "$release_check" >&2
            exit 1
          fi

  publish:
    name: Create tag and GitHub release
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Revalidate and generate release notes
        env:
          HARDWARE_STATUS: ${{ inputs.hardware_status }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 scripts/release_preflight.py \
            --expected-version "$RELEASE_VERSION" \
            --hardware-status "$HARDWARE_STATUS" \
            --notes-output "$RUNNER_TEMP/release-notes.md"

      - name: Recheck main and its successful Tests run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"

          green_runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f per_page=100 \
            --jq "[.workflow_runs[] | select(
              .head_sha == \"$GITHUB_SHA\" and
              .head_branch == \"main\" and
              .head_repository.full_name == \"$GITHUB_REPOSITORY\" and
              .conclusion == \"success\"
            )] | length")
          test "$green_runs" -ge 1

      - name: Create or safely reuse the exact tag
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if tag_sha=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}"); then
            test "$tag_sha" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "GuestyTerminal $RELEASE_VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if release_check=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1); then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          elif ! grep -q "HTTP 404" <<<"$release_check"; then
            echo "$release_check" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "GuestyTerminal $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

      - name: Write release summary
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: echo "Published $RELEASE_TAG from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
