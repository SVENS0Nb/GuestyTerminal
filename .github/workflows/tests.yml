name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release metadata and notices
        run: python3 scripts/release_preflight.py

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-test-tools.txt
            requirements-test-runner.txt

      - name: Install static-analysis dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check typing
        run: mypy custom_components/guesty_terminal scripts

      - name: Compile Python modules
        run: python -m compileall -q custom_components/guesty_terminal scripts

  test:
    name: Home Assistant ${{ matrix.homeassistant-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant-version: "2025.12.0"
            constraints: constraints-homeassistant-2025.12.txt
          - homeassistant-version: "2026.2.3"
            constraints: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test-runner.txt
            constraints-homeassistant-2025.12.txt

      - name: Install test dependencies
        shell: bash
        run: |
          constraint_file="${{ matrix.constraints }}"
          constraint_args=()
          if [[ -n "$constraint_file" ]]; then
            constraint_args=(-c "$constraint_file")
          fi
          python -m pip install "${constraint_args[@]}" \
            -r requirements-test-runner.txt \
            "homeassistant==${{ matrix.homeassistant-version }}"

      - name: Run tests with 80% coverage gate
        run: pytest

  firmware:
    name: ESPHome firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: safe 4 MB
            flash_layout: legacy_4mb
            flash_size: 4MB
            large_flash_experimental: "false"
            maximum_size: 1835008
          - name: USB 32 MB
            flash_layout: expanded_32mb
            flash_size: 32MB
            large_flash_experimental: "true"
            maximum_size: 16515072
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-firmware.txt

      - name: Install ESPHome
        run: python -m pip install -r requirements-firmware.txt

      - name: Restore ESPHome toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/esphome
          key: >-
            ${{ runner.os }}-esphome-toolchain-${{
              hashFiles('requirements-firmware.txt')
            }}
          restore-keys: |
            ${{ runner.os }}-esphome-toolchain-
            ${{ runner.os }}-esphome-

      - name: Restore incremental firmware build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: esphome/.esphome/build/guestyterminal-display-1
          key: >-
            ${{ runner.os }}-guestyterminal-${{ matrix.flash_layout }}-${{
              hashFiles(
                'requirements-firmware.txt',
                'esphome/**/*.yaml',
                'esphome/components/**/*'
              )
            }}
          restore-keys: |
            ${{ runner.os }}-guestyterminal-${{ matrix.flash_layout }}-

      - name: Create non-production build secrets
        run: |
          cp esphome/secrets.example.yaml esphome/secrets.yaml
          sed -i 's/GENERATE_A_32_BYTE_BASE64_KEY/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' esphome/secrets.yaml

      - name: Validate ESPHome configuration
        run: >-
          esphome
          -s flash_layout ${{ matrix.flash_layout }}
          -s flash_size ${{ matrix.flash_size }}
          -s large_flash_experimental ${{ matrix.large_flash_experimental }}
          config esphome/guestyterminal-display-1.yaml

      - name: Compile E1001 firmware
        run: >-
          esphome
          -s flash_layout ${{ matrix.flash_layout }}
          -s flash_size ${{ matrix.flash_size }}
          -s large_flash_experimental ${{ matrix.large_flash_experimental }}
          compile esphome/guestyterminal-display-1.yaml

      - name: Enforce firmware flash budget
        shell: bash
        run: |
          firmware_bin=$(find esphome/.esphome/build -name firmware.ota.bin -print -quit)
          test -n "$firmware_bin"
          firmware_size=$(stat -c%s "$firmware_bin")
          maximum_size=${{ matrix.maximum_size }}
          maximum_budget=$((maximum_size * 95 / 100))
          test "$firmware_size" -le "$maximum_budget"
