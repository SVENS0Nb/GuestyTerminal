name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant-version: "2025.12.0"
            constraints: constraints-homeassistant-2025.12.txt
          - homeassistant-version: "2026.2.3"
            constraints: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test-tools.txt
            constraints-homeassistant-2025.12.txt

      - name: Install test dependencies
        shell: bash
        run: |
          constraint_file="${{ matrix.constraints }}"
          constraint_args=()
          if [[ -n "$constraint_file" ]]; then
            constraint_args=(-c "$constraint_file")
          fi
          python -m pip install "${constraint_args[@]}" \
            -r requirements-test-tools.txt \
            "homeassistant==${{ matrix.homeassistant-version }}"

      - name: Run linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check typing
        run: mypy custom_components/guesty_terminal

      - name: Compile Python modules
        run: python -m compileall -q custom_components/guesty_terminal

      - name: Run tests with 80% coverage gate
        run: pytest

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ESPHome
        run: python -m pip install esphome==2026.7.4

      - name: Create non-production build secrets
        run: |
          cp esphome/secrets.example.yaml esphome/secrets.yaml
          sed -i 's/GENERATE_A_32_BYTE_BASE64_KEY/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' esphome/secrets.yaml

      - name: Validate ESPHome configuration
        run: esphome config esphome/guestyterminal-display-1.yaml

      - name: Compile E1001 firmware
        run: esphome compile esphome/guestyterminal-display-1.yaml

      - name: Enforce firmware flash budget
        shell: bash
        run: |
          firmware_bin=$(find esphome/.esphome/build -name firmware.ota.bin -print -quit)
          test -n "$firmware_bin"
          firmware_size=$(stat -c%s "$firmware_bin")
          maximum_size=1835008
          maximum_budget=$((maximum_size * 95 / 100))
          test "$firmware_size" -le "$maximum_budget"
