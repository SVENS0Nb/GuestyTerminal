button:
  # User-facing controls are exposed as entities of this ESPHome display
  # device. Refresh is deliberately explicit and therefore bypasses the
  # automatic duplicate-image suppression used for background Guesty sync.
  - platform: template
    id: guesty_refresh_display
    name: Display aktualisieren
    icon: mdi:refresh
    on_press:
      # The endpoint pulse asks GuestyTerminal to refresh Guesty first. The
      # integration answers with one authoritative forced redraw, so this
      # button can never repaint stale local RAM or the wrong active page.
      - text_sensor.template.publish:
          id: guesty_terminal_endpoint
          state: "__guesty_refresh_requested__"
      - delay: 250ms
      - component.update: guesty_terminal_endpoint
  - platform: restart
    id: guesty_restart
    name: Neustart
    icon: mdi:restart
    entity_category: diagnostic
  - platform: template
    id: guesty_panel_self_test
