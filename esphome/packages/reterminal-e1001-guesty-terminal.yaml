                               panel_y + panel_height - panel_radius - 1,
                               panel_radius, color);
            };
            fill_rounded(x, y, width, height, radius, light_gray);
          };

          int battery_percent = id(guesty_display_battery_percent);
          bool battery_charging = id(guesty_display_battery_charging);
          if (battery_percent < 0
              && id(guesty_battery_level).has_state()
              && std::isfinite(id(guesty_battery_level).state)) {
            const int rounded = static_cast<int>(
                std::lround(id(guesty_battery_level).state));
            battery_percent = std::max(0, std::min(100,
                ((rounded + 2) / 5) * 5));
            battery_charging =
                id(guesty_external_power).has_state()
                && id(guesty_external_power).state
                && (id(guesty_charge_status_code) == 1
                    || id(guesty_charge_status_code) == 2);
          }
          it.print(32, 24, id(guesty_font_property),
                   id(guesty_property_name).c_str());
          if (battery_percent >= 0) {
            const auto battery_codepoint_for_percent = [](
                int percent, bool charging) -> uint32_t {
              if (charging) {
                if (percent <= 0) return 0xF089FUL;
                if (percent < 20) return 0xF089CUL;
                if (percent < 30) return 0xF0086UL;
                if (percent < 40) return 0xF0087UL;
                if (percent < 50) return 0xF0088UL;
                if (percent < 60) return 0xF089DUL;
                if (percent < 70) return 0xF0089UL;
                if (percent < 80) return 0xF089EUL;
                if (percent < 90) return 0xF008AUL;
                if (percent < 100) return 0xF008BUL;
                return 0xF0085UL;
              }
              if (percent <= 0) return 0xF008EUL;
              if (percent < 20) return 0xF007AUL;
              if (percent < 30) return 0xF007BUL;
              if (percent < 40) return 0xF007CUL;
              if (percent < 50) return 0xF007DUL;
              if (percent < 60) return 0xF007EUL;
              if (percent < 70) return 0xF007FUL;
              if (percent < 80) return 0xF0080UL;
              if (percent < 90) return 0xF0081UL;
              if (percent < 100) return 0xF0082UL;
              return 0xF0079UL;
            };
            const auto draw_rotated_battery_icon = [&](int right, int center_y,
                                                        uint32_t codepoint) {
              const auto *glyph =
                  id(guesty_font_battery_icon).find_glyph(codepoint);
              if (glyph == nullptr) return;
              const uint8_t bits_per_pixel =
                  id(guesty_font_battery_icon).get_bpp();
              const uint8_t maximum_coverage =
                  (1U << bits_per_pixel) - 1U;
              for (int source_y = 0; source_y < glyph->height; source_y++) {
                for (int source_x = 0; source_x < glyph->width; source_x++) {
                  const size_t pixel_index =
                      static_cast<size_t>(source_y) * glyph->width + source_x;
                  const size_t bit_index = pixel_index * bits_per_pixel;
                  const uint8_t packed = esphome::progmem_read_byte(
                      glyph->data + bit_index / 8U);
                  const uint8_t shift =
                      8U - bits_per_pixel - (bit_index & 0x07U);
                  const uint8_t coverage =
                      (packed >> shift) & maximum_coverage;
                  if (coverage == 0) continue;
                  const uint8_t ink = static_cast<uint8_t>(
                      (static_cast<uint16_t>(coverage) * 255U
                       + maximum_coverage / 2U) / maximum_coverage);
                  // Clockwise rotation puts the original top terminal on the
                  // right. Align the visible (cropped) glyph bitmap by its
                  // center rather than by the font line box: MDI's nominal
                  // size includes substantial side bearings that otherwise
                  // make the rotated icon look too small and too high.
                  const int destination_x = right - 1 - source_y;
                  const int destination_y =
                      center_y - glyph->width / 2 + source_x;
                  it.draw_pixel_at(destination_x, destination_y,
                                   Color(ink, ink, ink));
                }
              }
            };
            it.printf(660, 24, id(guesty_font_weather_temperature),
                      TextAlign::TOP_LEFT, "%d %%", battery_percent);
            draw_rotated_battery_icon(
                768, 38,
                battery_codepoint_for_percent(
                    battery_percent, battery_charging));
          }
          const std::string &empty_title = id(guesty_next_booking_title).empty()
              ? id(guesty_idle_title) : id(guesty_next_booking_title);
          it.print(32, 82, id(guesty_font_label), empty_title.c_str());
          it.line(32, 116, 768, 116);

          if (id(guesty_next_booking_guest).empty()) {
            it.print(400, 208, id(guesty_font_welcome_small),
                     TextAlign::TOP_CENTER,
                     id(guesty_idle_text).c_str());
          } else {
            const int note_count =
                (!id(guesty_general_notes).empty() ? 1 : 0)
                + (!id(guesty_cleaner_notes).empty() ? 1 : 0)
                + (!id(guesty_special_requests).empty() ? 1 : 0);
            const int guest_y = note_count == 0 ? 190 : 142;
            const int period_y = note_count == 0 ? 252 : 202;
            it.print(32, guest_y, id(guesty_font_welcome),
                     id(guesty_next_booking_guest).c_str());
            it.print(32, period_y, id(guesty_font_body),
                     id(guesty_next_booking_period).c_str());

            if (note_count > 0) {
              struct NoteCard {
                std::string label;
                std::string text;
              };
              std::vector<NoteCard> cards;
              if (!id(guesty_general_notes).empty()) {
                cards.push_back({id(guesty_general_notes_label),
                                 id(guesty_general_notes)});
              }
              if (!id(guesty_cleaner_notes).empty()) {
                cards.push_back({id(guesty_cleaner_notes_label),
                                 id(guesty_cleaner_notes)});
              }
              if (!id(guesty_special_requests).empty()) {
                cards.push_back({id(guesty_special_requests_label),
                                 id(guesty_special_requests)});
              }

              constexpr int cards_x = 32;
              constexpr int cards_y = 246;
              constexpr int cards_width = 736;
              constexpr int cards_height = 202;
              constexpr int gap = 16;
              const int card_width =
                  (cards_width - gap * (note_count - 1)) / note_count;
              for (int index = 0; index < note_count; index++) {
                const int x = cards_x + index * (card_width + gap);
                const int width = index == note_count - 1
                    ? cards_x + cards_width - x : card_width;
                draw_rounded_panel(x, cards_y, width, cards_height, 12);
                it.print(x + 20, cards_y + 20, id(guesty_font_label),
                         cards[index].label.c_str());
                draw_lines(x + 20, cards_y + 56, cards[index].text,
                           id(guesty_font_detail), 24, 6);
              }
            }
          }

      # Neutral hardware pattern used only by the diagnostic self-test. Keep a
      # completely white 24-pixel canvas margin so a dark controller border is
      # distinguishable from renderer pixels. The second phase changes only
      # the configured 136x64 monochrome header window.
      - id: guesty_self_test_page
        lambda: |-
          it.fill(COLOR_OFF);
          it.print(32, 24, id(guesty_font_label), "E-PAPER HARDWARETEST");
          it.print(32, 58, id(guesty_font_detail),
                   "Vier Graustufen · weißer Außenbereich · Teilrefresh");

          constexpr int band_y = 128;
          constexpr int band_height = 272;
          constexpr int band_width = 172;
          constexpr int band_gap = 16;
          constexpr int band_x = 32;
          const Color levels[4] = {
              COLOR_OFF,
              Color(85, 85, 85),
              Color(170, 170, 170),
              COLOR_ON,
          };
          const char *labels[4] = {"WEISS", "HELL", "DUNKEL", "SCHWARZ"};
          for (int index = 0; index < 4; index++) {
            const int x = band_x + index * (band_width + band_gap);
            it.filled_rectangle(x, band_y, band_width, band_height,
                                levels[index]);
            it.rectangle(x, band_y, band_width, band_height, COLOR_ON);
            it.print(x + band_width / 2, 424, id(guesty_font_detail),
                     TextAlign::TOP_CENTER, labels[index]);
          }

          if (id(guesty_self_test_partial_phase)) {
            it.filled_rectangle(640, 8, 136, 64, COLOR_ON);
            it.filled_rectangle(656, 24, 104, 32, COLOR_OFF);
          } else {
            it.filled_rectangle(640, 8, 136, 64, COLOR_OFF);
            it.rectangle(648, 16, 120, 48, COLOR_ON);
          }

deep_sleep:
  id: guesty_deep_sleep
  sleep_duration: ${battery_sleep_duration}
  wakeup_pin:
    number: GPIO3
    allow_other_uses: true
    mode: INPUT_PULLUP
    inverted: true
  # If sleep begins while the momentary button is still held, invert the next
  # wake edge instead of immediately waking in a battery-draining loop.
  wakeup_pin_mode: INVERT_WAKEUP

interval:
  # On battery, battery and SHT40 values are captured once during boot before
  # deep sleep. While confirmed USB power keeps the device online, refresh the
  # battery entity and the three-sample environmental average every five
  # minutes. A forced mains profile without a physical cable must not turn a
  # battery cycle into continuous environmental polling.
  - interval: 5min
    then:
      - output.turn_on: guesty_battery_enable
      - delay: 200ms
      - component.update: guesty_battery_voltage
      - delay: 20ms
      - component.update: guesty_battery_level
      - output.turn_off: guesty_battery_enable
      - if:
          condition:
            lambda: |-
              return id(guesty_external_power).has_state()
                  && id(guesty_external_power).state;
          then:
            - component.update: guesty_environment
  - interval: 15s
    then:
      - script.execute: guesty_read_external_power
      - script.wait: guesty_read_external_power
      # Start or recover I2S only after the completed power observation and
      # after every audio consumer is configured. The initial template-binary-
      # sensor publication deliberately emits no on_press event, so attempt 0
      # must be eligible here when the device boots with USB already attached.
      # Three attempts per cable session are sufficient to bridge transient
      # resource contention without creating an endless retry loop.
      - if:
          condition:
            lambda: |-
              return id(guesty_component_setup_complete)
                  && id(guesty_external_power).has_state()
                  && id(guesty_external_power).state
                  && !id(guesty_microphone).is_running()
                  && !id(guesty_start_microphone).is_running()
                  && id(guesty_microphone_start_attempts) < 3;
          then:
            - script.execute: guesty_start_microphone
      # On battery, give WiFi/Home Assistant a bounded window to deliver data.
      # If no payload arrives, clear any retained credentials before sleeping.
      - if:
          condition:
            lambda: |-
              const std::string profile = "${power_mode}";
              const bool battery_mode = profile == "battery"
                  || (profile != "mains"
                      && (!id(guesty_external_power).has_state()
                          || !id(guesty_external_power).state));
              return battery_mode
                  && !id(guesty_self_test_active)
                  && !id(guesty_epaper).update_in_progress()
                  && (id(guesty_update_received_this_boot)
                      || millis()
                          >= static_cast<uint32_t>(${awake_duration_seconds})
                              * 1000UL);
          then:
            - if:
                condition:
                  lambda: |-
                    return id(guesty_screen_sensitive)
                        && (!id(guesty_update_received_this_boot)
                            || id(guesty_mode) == "idle");
                then:
                  - lambda: |-
                      id(guesty_mode) = "idle";
                      id(guesty_welcome_title) = id(guesty_idle_title);
                      id(guesty_welcome_text) = id(guesty_idle_text);
                      id(guesty_door_code).clear();
                      id(guesty_wifi_name).clear();
                      id(guesty_wifi_password).clear();
                      id(guesty_weather_condition).clear();
                      id(guesty_weather_temperature).clear();
                      id(guesty_checkout_label).clear();
                      id(guesty_checkout_instructions_title).clear();
                      id(guesty_checkout_instructions).clear();
                      id(guesty_next_booking_guest).clear();
                      id(guesty_next_booking_period).clear();
                      id(guesty_general_notes).clear();
                      id(guesty_cleaner_notes).clear();
                      id(guesty_special_requests).clear();
                      id(guesty_has_wifi) = false;
                      id(guesty_has_weather) = false;
                      id(guesty_privacy_clear_pending) = true;
                  - display.page.show: guesty_idle_page
                  - lambda: |-
                      // Border conditioning is deliberately unavailable on
                      // battery. Mark this full privacy clear as unconditioned
                      // so the next confirmed mains cycle can repair the edge.
                      id(guesty_border_conditioning_requested) = false;
                  - component.update: guesty_epaper
                  - wait_until:
                      condition:
                        lambda: return !id(guesty_epaper).update_in_progress();
                      timeout: 120s
                  - if:
                      condition:
                        lambda: |-
                          return !id(guesty_epaper).update_in_progress()
                              && id(guesty_epaper).last_update_successful();
                      then:
                        - lambda: |-
                            id(guesty_screen_sensitive) = false;
                            id(guesty_valid_until_epoch) = 0;
                            id(guesty_content_id).clear();
                            id(guesty_base_content_id).clear();
                            id(guesty_privacy_clear_pending) = false;
                            id(guesty_border_conditioning_revision) = 0;
                        - text_sensor.template.publish:
                            id: guesty_last_booking
                            state: !lambda |-
                              return id(guesty_no_active_booking_label);
                      else:
                        - logger.log:
                            level: ERROR
                            format: "Privacy clear failed; keeping the device awake for another attempt"
            # This timeout path can also finish before ESPHome's default 60s
            # OTA validation window when awake_duration_seconds is configured
            # near its 30-second minimum.
            # The first action normally starts this script immediately. This
            # second condition is a watchdog for a cancelled/deferred action:
            # a successfully received sensitive payload is safe to retain on
            # the panel, while an unconfirmed privacy clear must stay awake.
            - if:
                condition:
                  lambda: |-
                    return !id(guesty_screen_sensitive)
                        || (id(guesty_update_received_this_boot)
                            && id(guesty_mode) != "idle"
                            && !id(guesty_privacy_clear_pending));
                then:
                  - script.execute: guesty_enter_battery_sleep
      # On permanent power there is no next wake-up cycle. Enforce the payload
      # lease continuously so stale access data still disappears locally.
      - if:
          condition:
            lambda: |-
              const std::string profile = "${power_mode}";
              const bool stay_online = profile == "mains"
                  || (profile == "auto"
                      && id(guesty_external_power).has_state()
                      && id(guesty_external_power).state);
              const auto now = id(guesty_rtc).now();
              return stay_online
                  && !id(guesty_self_test_active)
                  && !id(guesty_epaper).update_in_progress()
                  && id(guesty_screen_sensitive)
                  && (id(guesty_privacy_clear_pending)
                      || id(guesty_valid_until_epoch) == 0
                      || !now.is_valid()
                      || now.timestamp >= id(guesty_valid_until_epoch));
          then:
            - lambda: |-
                id(guesty_mode) = "idle";
                id(guesty_welcome_title) = id(guesty_idle_title);
                id(guesty_welcome_text) = id(guesty_idle_text);
                id(guesty_door_code).clear();
                id(guesty_wifi_name).clear();
                id(guesty_wifi_password).clear();
                id(guesty_weather_condition).clear();
                id(guesty_weather_temperature).clear();
                id(guesty_checkout_label).clear();
                id(guesty_checkout_instructions_title).clear();
                id(guesty_checkout_instructions).clear();
                id(guesty_next_booking_guest).clear();
                id(guesty_next_booking_period).clear();
                id(guesty_general_notes).clear();
                id(guesty_cleaner_notes).clear();
                id(guesty_special_requests).clear();
                id(guesty_has_wifi) = false;
                id(guesty_has_weather) = false;
                id(guesty_privacy_clear_pending) = true;
            - display.page.show: guesty_idle_page
            - lambda: |-
                const bool confirmed_external_power =
                    id(guesty_external_power).has_state()
                    && id(guesty_external_power).state;
                id(guesty_border_conditioning_requested) = false;
                if (confirmed_external_power) {
                  id(guesty_epaper).request_border_recovery();
                  id(guesty_border_conditioning_requested) = true;
                }
            - component.update: guesty_epaper
            - wait_until:
                condition:
                  lambda: return !id(guesty_epaper).update_in_progress();
                timeout: 120s
            - if:
                condition:
                  lambda: |-
                    return !id(guesty_epaper).update_in_progress()
                        && id(guesty_epaper).last_update_successful();
                then:
                  - lambda: |-
                      id(guesty_screen_sensitive) = false;
                      id(guesty_valid_until_epoch) = 0;
                      id(guesty_content_id).clear();
                      id(guesty_base_content_id).clear();
                      id(guesty_privacy_clear_pending) = false;
                      id(guesty_border_conditioning_revision) =
                          id(guesty_border_conditioning_requested) ? 1 : 0;
                      id(guesty_border_conditioning_requested) = false;
                  - text_sensor.template.publish:
                      id: guesty_last_booking
                      state: !lambda |-
                        return id(guesty_no_active_booking_label);
                else:
                  - lambda: |-
                      if (id(guesty_border_conditioning_requested)) {
                        id(guesty_border_conditioning_revision) = 0;
                      }
                      id(guesty_border_conditioning_requested) = false;
                  - logger.log:
                      level: ERROR
                      format: "Privacy clear failed; retrying while external power is available"
