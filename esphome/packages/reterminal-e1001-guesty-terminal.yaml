      - id: guesty_idle_page
        lambda: |-
          const auto draw_lines = [&](int x, int y, const std::string &text,
                                      esphome::font::Font *font,
                                      int line_height, int maximum_lines) {
            size_t start = 0;
            int line = 0;
            while (start <= text.size() && line < maximum_lines) {
              const size_t end = text.find('\n', start);
              const std::string part = text.substr(
                  start, end == std::string::npos ? std::string::npos : end - start);
              it.print(x, y + line * line_height, font, part.c_str());
              line++;
              if (end == std::string::npos) break;
              start = end + 1;
            }
          };

          const auto draw_rounded_panel = [&](int x, int y, int width,
                                               int height, int radius) {
            const Color light_gray(85, 85, 85);
            it.filled_rectangle(x + radius, y, width - radius * 2,
                                height, light_gray);
            it.filled_rectangle(x, y + radius, width,
                                height - radius * 2, light_gray);
            it.filled_circle(x + radius, y + radius, radius, light_gray);
            it.filled_circle(x + width - radius - 1, y + radius,
                             radius, light_gray);
            it.filled_circle(x + radius, y + height - radius - 1,
                             radius, light_gray);
            it.filled_circle(x + width - radius - 1,
                             y + height - radius - 1, radius, light_gray);
          };

          int battery_percent = id(guesty_display_battery_percent);
          if (battery_percent < 0
              && id(guesty_battery_level).has_state()
              && std::isfinite(id(guesty_battery_level).state)) {
            const int rounded = static_cast<int>(
                std::lround(id(guesty_battery_level).state));
            battery_percent = std::max(0, std::min(100,
                ((rounded + 2) / 5) * 5));
          }
          it.print(32, 24, id(guesty_font_property),
                   id(guesty_property_name).c_str());
          if (battery_percent >= 0) {
            it.print(650, 12, id(guesty_font_weather_icon),
                     "\U000F0079");
            it.printf(768, 27, id(guesty_font_weather_temperature),
                      TextAlign::TOP_RIGHT, "%d %%",
                      battery_percent);
          }
          const std::string &empty_title = id(guesty_next_booking_title).empty()
              ? id(guesty_idle_title) : id(guesty_next_booking_title);
          it.print(32, 82, id(guesty_font_label), empty_title.c_str());
          it.line(32, 116, 768, 116);

          if (id(guesty_next_booking_guest).empty()) {
            it.print(400, 208, id(guesty_font_welcome_small),
                     TextAlign::TOP_CENTER,
                     id(guesty_idle_text).c_str());
          } else {
            const int note_count =
                (!id(guesty_general_notes).empty() ? 1 : 0)
                + (!id(guesty_cleaner_notes).empty() ? 1 : 0)
                + (!id(guesty_special_requests).empty() ? 1 : 0);
            const int guest_y = note_count == 0 ? 190 : 142;
            const int period_y = note_count == 0 ? 252 : 202;
            it.print(32, guest_y, id(guesty_font_welcome),
                     id(guesty_next_booking_guest).c_str());
            it.print(32, period_y, id(guesty_font_body),
                     id(guesty_next_booking_period).c_str());

            if (note_count > 0) {
              struct NoteCard {
                std::string label;
                std::string text;
              };
              std::vector<NoteCard> cards;
              if (!id(guesty_general_notes).empty()) {
                cards.push_back({id(guesty_general_notes_label),
                                 id(guesty_general_notes)});
              }
              if (!id(guesty_cleaner_notes).empty()) {
                cards.push_back({id(guesty_cleaner_notes_label),
                                 id(guesty_cleaner_notes)});
              }
              if (!id(guesty_special_requests).empty()) {
                cards.push_back({id(guesty_special_requests_label),
                                 id(guesty_special_requests)});
              }

              constexpr int cards_x = 32;
              constexpr int cards_y = 246;
              constexpr int cards_width = 736;
              constexpr int cards_height = 202;
              constexpr int gap = 16;
              const int card_width =
                  (cards_width - gap * (note_count - 1)) / note_count;
              for (int index = 0; index < note_count; index++) {
                const int x = cards_x + index * (card_width + gap);
                const int width = index == note_count - 1
                    ? cards_x + cards_width - x : card_width;
                draw_rounded_panel(x, cards_y, width, cards_height, 12);
                it.print(x + 20, cards_y + 20, id(guesty_font_label),
                         cards[index].label.c_str());
                draw_lines(x + 20, cards_y + 56, cards[index].text,
                           id(guesty_font_detail), 24, 6);
              }
            }
          }

deep_sleep:
  id: guesty_deep_sleep
  sleep_duration: ${battery_sleep_duration}
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        allow_other_uses: true
        mode: INPUT_PULLUP
    mode: ANY_LOW

interval:
  # On battery this runs once during boot before deep sleep. While USB power
  # keeps the device online, refresh the battery entity every five minutes.
  - interval: 5min
    then:
      - output.turn_on: guesty_battery_enable
      - delay: 200ms
      - component.update: guesty_battery_voltage
      - delay: 20ms
      - component.update: guesty_battery_level
      - output.turn_off: guesty_battery_enable
  - interval: 15s
    then:
      - script.execute: guesty_read_external_power
      - script.wait: guesty_read_external_power
      # On battery, give WiFi/Home Assistant a bounded window to deliver data.
      # If no payload arrives, clear any retained credentials before sleeping.
      - if:
          condition:
            lambda: |-
              const std::string profile = "${power_mode}";
              const bool battery_mode = profile == "battery"
                  || (profile != "mains"
                      && (!id(guesty_external_power).has_state()
                          || !id(guesty_external_power).state));
              return battery_mode
                  && millis() >= static_cast<uint32_t>(${awake_duration_seconds})
                      * 1000UL;
          then:
            - if:
                condition:
                  lambda: |-
                    return id(guesty_screen_sensitive)
                        && !id(guesty_update_received_this_boot);
                then:
                  - lambda: |-
                      id(guesty_mode) = "idle";
                      id(guesty_welcome_title) = id(guesty_idle_title);
                      id(guesty_welcome_text) = id(guesty_idle_text);
                      id(guesty_door_code).clear();
                      id(guesty_wifi_name).clear();
                      id(guesty_wifi_password).clear();
                      id(guesty_weather_condition).clear();
                      id(guesty_weather_temperature).clear();
                      id(guesty_checkout_label).clear();
                      id(guesty_checkout_instructions_title).clear();
                      id(guesty_checkout_instructions).clear();
                      id(guesty_next_booking_guest).clear();
                      id(guesty_next_booking_period).clear();
                      id(guesty_general_notes).clear();
                      id(guesty_cleaner_notes).clear();
                      id(guesty_special_requests).clear();
                      id(guesty_has_wifi) = false;
                      id(guesty_has_weather) = false;
                      id(guesty_screen_sensitive) = false;
                      id(guesty_valid_until_epoch) = 0;
                      id(guesty_content_id).clear();
                      id(guesty_base_content_id).clear();
                  - display.page.show: guesty_idle_page
                  - component.update: guesty_epaper
                  - delay: 7s
                  - if:
                      condition:
                        lambda: return id(guesty_epaper).last_update_successful();
                      then:
                        - text_sensor.template.publish:
                            id: guesty_last_booking
                            state: !lambda |-
                              return id(guesty_no_active_booking_label);
            - deep_sleep.enter: guesty_deep_sleep
      # On permanent power there is no next wake-up cycle. Enforce the payload
      # lease continuously so stale access data still disappears locally.
      - if:
          condition:
            lambda: |-
              const std::string profile = "${power_mode}";
              const bool stay_online = profile == "mains"
                  || (profile == "auto"
                      && id(guesty_external_power).has_state()
                      && id(guesty_external_power).state);
              const auto now = id(guesty_rtc).now();
              return stay_online
                  && id(guesty_screen_sensitive)
                  && id(guesty_valid_until_epoch) > 0
                  && (!now.is_valid()
                      || now.timestamp >= id(guesty_valid_until_epoch));
          then:
            - lambda: |-
                id(guesty_mode) = "idle";
                id(guesty_welcome_title) = id(guesty_idle_title);
                id(guesty_welcome_text) = id(guesty_idle_text);
                id(guesty_door_code).clear();
                id(guesty_wifi_name).clear();
                id(guesty_wifi_password).clear();
                id(guesty_weather_condition).clear();
                id(guesty_weather_temperature).clear();
                id(guesty_checkout_label).clear();
                id(guesty_checkout_instructions_title).clear();
                id(guesty_checkout_instructions).clear();
                id(guesty_next_booking_guest).clear();
                id(guesty_next_booking_period).clear();
                id(guesty_general_notes).clear();
                id(guesty_cleaner_notes).clear();
                id(guesty_special_requests).clear();
                id(guesty_has_wifi) = false;
                id(guesty_has_weather) = false;
                id(guesty_screen_sensitive) = false;
                id(guesty_valid_until_epoch) = 0;
                id(guesty_content_id).clear();
                id(guesty_base_content_id).clear();
            - display.page.show: guesty_idle_page
            - component.update: guesty_epaper
            - delay: 7s
            - if:
                condition:
                  lambda: return id(guesty_epaper).last_update_successful();
                then:
                  - text_sensor.template.publish:
                      id: guesty_last_booking
                      state: !lambda |-
                        return id(guesty_no_active_booking_label);
