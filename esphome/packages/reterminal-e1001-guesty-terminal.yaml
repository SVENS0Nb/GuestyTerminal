# reTerminal E1001 GuestyTerminal display package
# Target: ESPHome + Home Assistant GuestyTerminal custom integration

substitutions:
  power_mode: auto
  battery_sleep_duration: 30min
  awake_duration_seconds: "90"
  gray_lut_mode: auto

psram:
  mode: octal
  speed: 80MHz

esphome:
  on_boot:
    - priority: 700
      then:
        # Keep every user-visible/audible peripheral off. The SY6974B STAT
        # output drives the red charging LED independently from GPIO6, so its
        # pin function is disabled over the charger's dedicated I2C bus too.
        - output.turn_off: guesty_status_led
        - output.turn_off: guesty_buzzer
        - output.turn_off: guesty_microphone_power
        - lambda: |-
            auto *bus = id(guesty_power_i2c);
            uint8_t reg = 0x05;
            uint8_t value = 0;
            if (bus->write_readv(0x6B, &reg, 1, &value, 1)
                == esphome::i2c::ERROR_OK) {
              // Disable the charger watchdog so STAT_DIS remains effective.
              value &= 0xCF;
              const uint8_t payload[] = {reg, value};
              bus->write(0x6B, payload, sizeof(payload));
            }
            reg = 0x00;
            if (bus->write_readv(0x6B, &reg, 1, &value, 1)
                == esphome::i2c::ERROR_OK) {
              // REG00 STAT_DIS[1:0] = 11: charging LED output floats/off.
              value |= 0x60;
              const uint8_t payload[] = {reg, value};
              bus->write(0x6B, payload, sizeof(payload));
            }
    - priority: 600
      then:
        - output.turn_on: guesty_battery_enable
        - delay: 200ms
        - component.update: guesty_battery_voltage
        - delay: 20ms
        - component.update: guesty_battery_level
        - output.turn_off: guesty_battery_enable
        - pcf8563.read_time:
        - component.update: guesty_environment
    - priority: -100
      then:
        - script.execute: guesty_read_external_power
        - script.wait: guesty_read_external_power
        - delay: 500ms
        - component.update: guesty_terminal_endpoint

api:
  reboot_timeout: 0s
  # A fast restart can be shorter than Home Assistant's offline detection
  # window. Pulse the endpoint after Home Assistant connects so the integration
  # reliably resends its cached payload on every wake cycle.
  on_client_connected:
    then:
      - if:
          condition:
            lambda: |-
              return client_info.find("Home Assistant")
                  != std::string::npos;
          then:
            - text_sensor.template.publish:
                id: guesty_terminal_endpoint
                state: "__guesty_reconnecting__"
            - delay: 1s
            - component.update: guesty_terminal_endpoint
  actions:
    - action: guesty_terminal_update_display_v9
      variables:
        mode: string
        property_name: string
        welcome_title: string
        welcome_text: string
        door_code: string
        wifi_name: string
        wifi_password: string
        checkout_label: string
        door_code_label: string
        wifi_label: string
        wifi_name_label: string
        wifi_key_label: string
        idle_title: string
        idle_text: string
        no_active_booking_label: string
        checkout_instructions_title: string
        checkout_instructions: string
        next_booking_title: string
        next_booking_guest: string
        next_booking_period: string
        general_notes_label: string
        general_notes: string
        cleaner_notes_label: string
        cleaner_notes: string
        special_requests_label: string
        special_requests: string
        valid_until_epoch: int
        content_id: string
        base_content_id: string
        force_redraw: bool
        logo_data: string
        booking_summary: string
        weather_condition: string
        weather_temperature: string
      then:
        - lambda: |-
            id(guesty_update_received_this_boot) = true;
            const bool renderer_current = id(guesty_render_revision) == 16;
            int battery_percent = -1;
            if (id(guesty_battery_level).has_state()
                && std::isfinite(id(guesty_battery_level).state)) {
              const int rounded = static_cast<int>(
                  std::lround(id(guesty_battery_level).state));
              battery_percent = std::max(0, std::min(100,
                  ((rounded + 2) / 5) * 5));
            }
            const bool empty_page = mode != "welcome" && mode != "checkout";
            const bool battery_changed = empty_page
                && battery_percent >= 0
                && battery_percent != id(guesty_rendered_battery_percent);
            id(guesty_content_changed) = force_redraw || content_id.empty()
                || content_id != id(guesty_content_id)
                || !renderer_current
                || battery_changed;
            id(guesty_weather_only_changed) = id(guesty_content_changed)
                && !force_redraw
                && renderer_current
                && !content_id.empty()
                && !base_content_id.empty()
                && base_content_id == id(guesty_base_content_id)
                && !empty_page;
            id(guesty_battery_only_changed) = battery_changed
                && !force_redraw
                && renderer_current
                && !content_id.empty()
                && content_id == id(guesty_content_id);
            id(guesty_display_battery_percent) = battery_percent;
            id(guesty_mode) = mode;
            id(guesty_property_name) = property_name;
            id(guesty_welcome_title) = welcome_title;
            id(guesty_welcome_text) = welcome_text;
            id(guesty_door_code) = door_code;
            id(guesty_wifi_name) = wifi_name;
            id(guesty_wifi_password) = wifi_password;
            id(guesty_checkout_label) = checkout_label;
            id(guesty_door_code_label) = door_code_label;
            id(guesty_wifi_label) = wifi_label;
            id(guesty_wifi_name_label) = wifi_name_label;
            id(guesty_wifi_key_label) = wifi_key_label;
            id(guesty_idle_title) = idle_title;
            id(guesty_idle_text) = idle_text;
            id(guesty_no_active_booking_label) = no_active_booking_label;
            id(guesty_checkout_instructions_title) = checkout_instructions_title;
            id(guesty_checkout_instructions) = checkout_instructions;
            id(guesty_next_booking_title) = next_booking_title;
            id(guesty_next_booking_guest) = next_booking_guest;
            id(guesty_next_booking_period) = next_booking_period;
            id(guesty_general_notes_label) = general_notes_label;
            id(guesty_general_notes) = general_notes;
            id(guesty_cleaner_notes_label) = cleaner_notes_label;
            id(guesty_cleaner_notes) = cleaner_notes;
            id(guesty_special_requests_label) = special_requests_label;
            id(guesty_special_requests) = special_requests;
            id(guesty_logo_data) = logo_data;
            id(guesty_weather_condition) = weather_condition;
            id(guesty_weather_temperature) = weather_temperature;
            id(guesty_valid_until_epoch) = valid_until_epoch;
            id(guesty_screen_sensitive) = mode != "idle";
            id(guesty_has_wifi) =
                mode == "welcome" && !wifi_name.empty();
            id(guesty_has_weather) =
                (mode == "welcome" || mode == "checkout")
                && (!weather_condition.empty() || !weather_temperature.empty());

            if (id(guesty_content_changed) && id(guesty_has_wifi)) {
              const auto escape_wifi = [](const std::string &input) {
                std::string escaped;
                escaped.reserve(input.size() + 8);
                for (const char character : input) {
                  if (character == '\\' || character == ';'
                      || character == ',' || character == ':') {
                    escaped.push_back('\\');
                  }
                  escaped.push_back(character);
                }
                return escaped;
              };
              const std::string security =
                  wifi_password.empty() ? "nopass" : "WPA";
              const std::string qr_value =
                  "WIFI:T:" + security
                  + ";S:" + escape_wifi(wifi_name)
                  + ";P:" + escape_wifi(wifi_password) + ";;";
              id(guesty_wifi_qr).set_value(qr_value);
              id(guesty_wifi_qr).generate_qr_code();
            }
        # Page selection is runtime state and does not survive a reboot. Restore
        # it on every payload, even when the retained content fingerprint proves
        # that no physical E-paper refresh is needed.
        - if:
            condition:
              lambda: return mode == "checkout";
            then:
              - display.page.show: guesty_checkout_page
            else:
              - if:
                  condition:
                    lambda: return mode == "welcome";
                  then:
                    - display.page.show: guesty_welcome_page
                  else:
                    - display.page.show: guesty_idle_page
        - if:
            condition:
              lambda: return id(guesty_content_changed);
            then:
              - lambda: |-
                  if (id(guesty_weather_only_changed)
                      || id(guesty_battery_only_changed)) {
                    id(guesty_epaper).request_partial_update();
                  }
              - component.update: guesty_epaper
              - delay: 7s
              - if:
                  condition:
                    lambda: return id(guesty_epaper).last_update_successful();
                  then:
                    - lambda: |-
                        id(guesty_content_id) = content_id;
                        id(guesty_base_content_id) = base_content_id;
                        id(guesty_render_revision) = 16;
                        if (mode != "welcome" && mode != "checkout"
                            && id(guesty_display_battery_percent) >= 0) {
                          id(guesty_rendered_battery_percent) =
                              id(guesty_display_battery_percent);
                        }
                    - text_sensor.template.publish:
                        id: guesty_last_booking
                        state: !lambda |-
                          return booking_summary;
                  else:
                    - logger.log:
                        level: WARN
                        format: "E-paper refresh failed; booking confirmation was not published"
            else:
              # No panel refresh is needed, but restored globals (especially
              # the renewed privacy lease) need one scheduler cycle before
              # battery mode enters deep sleep. A matching persisted content
              # ID plus renderer revision proves this booking was drawn during
              # an earlier successful refresh.
              - text_sensor.template.publish:
                  id: guesty_last_booking
                  state: !lambda |-
                    return booking_summary;
              - delay: 1200ms
        - if:
            condition:
              lambda: |-
                const std::string profile = "${power_mode}";
                return profile == "battery"
                    || (profile != "mains"
                        && (!id(guesty_external_power).has_state()
                            || !id(guesty_external_power).state));
            then:
              - deep_sleep.enter: guesty_deep_sleep

globals:
  - id: guesty_mode
    type: std::string
    initial_value: '"idle"'
  - id: guesty_property_name
    type: std::string
    initial_value: '"UNTERKUNFT"'
  - id: guesty_welcome_title
    type: std::string
    initial_value: '"NÄCHSTE BUCHUNG"'
  - id: guesty_welcome_text
    type: std::string
    initial_value: '"Keine bevorstehende Buchung"'
  - id: guesty_door_code
    type: std::string
    initial_value: '""'
  - id: guesty_wifi_name
    type: std::string
    initial_value: '""'
  - id: guesty_wifi_password
    type: std::string
    initial_value: '""'
  - id: guesty_checkout_label
    type: std::string
    initial_value: '""'
  - id: guesty_door_code_label
    type: std::string
    initial_value: '"TÜRCODE"'
  - id: guesty_wifi_label
    type: std::string
    initial_value: '"WIFI"'
  - id: guesty_wifi_name_label
    type: std::string
    initial_value: '"Name:"'
  - id: guesty_wifi_key_label
    type: std::string
    initial_value: '"Key:"'
  # The neutral screen copy is non-sensitive and survives deep sleep so a
  # local privacy fallback keeps the display's configured language.
  - id: guesty_idle_title
    type: std::string
    restore_value: true
    max_restore_data_length: 48
    initial_value: '"NÄCHSTE BUCHUNG"'
  - id: guesty_idle_text
    type: std::string
    restore_value: true
    max_restore_data_length: 160
    initial_value: '"Keine bevorstehende Buchung"'
  - id: guesty_no_active_booking_label
    type: std::string
    restore_value: true
    max_restore_data_length: 64
    initial_value: '"Keine aktive Buchung"'
  - id: guesty_checkout_instructions_title
    type: std::string
    initial_value: '"CHECK-OUT"'
  - id: guesty_checkout_instructions
    type: std::string
    initial_value: '""'
  - id: guesty_next_booking_title
    type: std::string
    initial_value: '""'
  - id: guesty_next_booking_guest
    type: std::string
    initial_value: '""'
  - id: guesty_next_booking_period
    type: std::string
    initial_value: '""'
  - id: guesty_general_notes_label
    type: std::string
    initial_value: '"ALLGEMEINE NOTIZEN"'
  - id: guesty_general_notes
    type: std::string
    initial_value: '""'
  - id: guesty_cleaner_notes_label
    type: std::string
    initial_value: '"FÜR DIE REINIGUNG"'
  - id: guesty_cleaner_notes
    type: std::string
    initial_value: '""'
  - id: guesty_special_requests_label
    type: std::string
    initial_value: '"SONDERWÜNSCHE"'
  - id: guesty_special_requests
    type: std::string
    initial_value: '""'
  - id: guesty_logo_data
    type: std::string
    initial_value: '""'
  - id: guesty_weather_condition
    type: std::string
    initial_value: '""'
  - id: guesty_weather_temperature
    type: std::string
    initial_value: '""'
  - id: guesty_has_wifi
    type: bool
    initial_value: "false"
  - id: guesty_has_weather
    type: bool
    initial_value: "false"
  - id: guesty_content_changed
    type: bool
    initial_value: "true"
  - id: guesty_weather_only_changed
    type: bool
    initial_value: "false"
  - id: guesty_battery_only_changed
    type: bool
    initial_value: "false"
  - id: guesty_display_battery_percent
    type: int
    initial_value: "-1"
  # Persist only an opaque, reservation-salted display fingerprint. This lets
  # the device skip identical E-paper refreshes without storing credentials.
  - id: guesty_content_id
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  # The non-weather fingerprint lets a temperature or condition change use a
  # small differential update even after the ESP32 wakes from deep sleep.
  - id: guesty_base_content_id
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  # A changed renderer or panel driver must repaint once even when the Guesty
  # payload itself is identical. Increment the expected value above whenever
  # the visible rendering pipeline changes.
  - id: guesty_render_revision
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # The empty-room battery widget is quantized to five-percent steps. Persist
  # only the last successfully drawn value so regular wake cycles can suppress
  # redundant panel activity while still updating the small header window.
  - id: guesty_rendered_battery_percent
    type: int
    restore_value: true
    initial_value: "-1"
  # Only privacy state, opaque fingerprints and non-sensitive header status
  # survive deep sleep. Door and WiFi credentials are never written to flash.
  - id: guesty_valid_until_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: guesty_screen_sensitive
    type: bool
    restore_value: true
    initial_value: "false"
  - id: guesty_update_received_this_boot
    type: bool
    initial_value: "false"

script:
  - id: guesty_read_external_power
    mode: restart
    then:
      - lambda: |-
          uint8_t reg = 0x08;
          uint8_t status = 0;
          const auto error = id(guesty_power_i2c)->write_readv(
              0x6B, &reg, 1, &status, 1);
          if (error == esphome::i2c::ERROR_OK) {
            id(guesty_external_power).publish_state((status & 0x04) != 0);
          } else {
            // Fail safe to battery behavior when the charger cannot be read.
            id(guesty_external_power).publish_state(false);
          }

font:
  - file: "gfonts://Inter@600"
    id: guesty_font_property
    size: 17
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Lora@600"
    id: guesty_font_welcome
    size: 46
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Lora@600"
    id: guesty_font_welcome_small
    size: 36
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@600"
    id: guesty_font_body
    size: 21
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@800"
    id: guesty_font_label
    size: 16
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: guesty_font_door_code
    size: 46
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: guesty_font_door_code_small
    size: 32
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@600"
    id: guesty_font_detail
    size: 16
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: guesty_font_detail_bold
    size: 16
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@600"
    id: guesty_font_weather_temperature
    size: 22
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  # Material Design Icons 7.4.47, the same established pictogram family used
  # throughout Home Assistant. Only the weather glyphs below are compiled into
  # the firmware; the complete webfont is never stored on the device.
  - file:
      type: web
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: guesty_font_weather_icon
    size: 48
    bpp: 4
    glyphs:
      - "\U000F002A" # mdi-alert-outline
      - "\U000F0079" # mdi-battery
      - "\U000F0590" # mdi-weather-cloudy
      - "\U000F0591" # mdi-weather-fog
      - "\U000F0592" # mdi-weather-hail
      - "\U000F0593" # mdi-weather-lightning
      - "\U000F0594" # mdi-weather-night
      - "\U000F0595" # mdi-weather-partly-cloudy
      - "\U000F0596" # mdi-weather-pouring
      - "\U000F0597" # mdi-weather-rainy
      - "\U000F0598" # mdi-weather-snowy
      - "\U000F0599" # mdi-weather-sunny
      - "\U000F059D" # mdi-weather-windy
      - "\U000F059E" # mdi-weather-windy-variant
      - "\U000F067E" # mdi-weather-lightning-rainy
      - "\U000F067F" # mdi-weather-snowy-rainy

qr_code:
  - id: guesty_wifi_qr
    value: "WIFI:T:WPA;S:Guest;P:Guest;;"
    ecc: MEDIUM

spi:
  id: guesty_epaper_spi
  clk_pin:
    number: GPIO7
    allow_other_uses: true
  mosi_pin:
    number: GPIO9
    allow_other_uses: true
  miso_pin: GPIO8

i2c:
  - id: guesty_i2c
    scl: GPIO20
    sda: GPIO19
  # The E1001 power schematic connects the SY6974B charger at 0x6B to this
  # separate bus. REG08.PG_STAT provides reliable USB/VBUS detection.
  - id: guesty_power_i2c
    scl: GPIO40
    sda: GPIO39
    scan: false
    frequency: 100kHz

output:
  - platform: gpio
    id: guesty_battery_enable
    pin: GPIO21
  - platform: gpio
    id: guesty_status_led
    pin:
      number: GPIO6
      inverted: true
  - platform: gpio
    id: guesty_buzzer
    pin: GPIO45
  - platform: gpio
    id: guesty_microphone_power
    pin: GPIO38

sensor:
  - platform: adc
    id: guesty_battery_voltage
    pin: GPIO1
    name: Battery voltage
    entity_category: diagnostic
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    id: guesty_battery_level
    name: Battery level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:battery
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: return id(guesty_battery_voltage).state;
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: sht4x
    id: guesty_environment
    i2c_id: guesty_i2c
    temperature:
      name: Temperature
      entity_category: diagnostic
    humidity:
      name: Relative humidity
      entity_category: diagnostic
    update_interval: never

text_sensor:
  # This diagnostic state is published only after a successful physical panel
  # refresh, or when a matching successful content ID is restored after wake.
  - platform: template
    id: guesty_last_booking
    name: Angezeigte Buchung
    icon: mdi:calendar-account
    entity_category: diagnostic
    update_interval: never
  # The Home Assistant integration discovers this entity. Its state is the
  # exact ESPHome action name to call while this device is awake.
  - platform: template
    id: guesty_terminal_endpoint
    name: GuestyTerminal Endpoint
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      std::string action = "${device_name}_guesty_terminal_update_display_v9";
      for (char &character : action) {
        if (character == '-') character = '_';
      }
      return {action};

binary_sensor:
  - platform: template
    id: guesty_external_power
    name: External power
    device_class: power
    entity_category: diagnostic
  - platform: gpio
    id: guesty_button_green
    name: Green button
    entity_category: diagnostic
    pin:
      number: GPIO3
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: guesty_button_middle
    name: Middle button
    entity_category: diagnostic
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: guesty_button_left
    name: Left button
    entity_category: diagnostic
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

button:
  # Both controls are exposed as entities of this ESPHome display device.
  # Refresh is deliberately explicit and therefore bypasses the automatic
  # duplicate-image suppression used for background Guesty synchronisation.
  - platform: template
    id: guesty_refresh_display
    name: Display aktualisieren
    icon: mdi:refresh
    on_press:
      # The endpoint pulse asks GuestyTerminal to refresh Guesty first. The
      # integration answers with one authoritative forced redraw, so this
      # button can never repaint stale local RAM or the wrong active page.
      - text_sensor.template.publish:
          id: guesty_terminal_endpoint
          state: "__guesty_refresh_requested__"
      - delay: 250ms
      - component.update: guesty_terminal_endpoint
  - platform: restart
    id: guesty_restart
    name: Neustart
    icon: mdi:restart
    entity_category: diagnostic

time:
  - platform: pcf8563
    id: guesty_rtc
    i2c_id: guesty_i2c
    address: 0x51
    update_interval: never
  - platform: homeassistant
    id: guesty_ha_time
    on_time_sync:
      then:
        - pcf8563.write_time:

display:
  - platform: guesty_epaper_gray4
    id: guesty_epaper
    clock_pin:
      number: GPIO7
      allow_other_uses: true
    data_pin:
      number: GPIO9
      allow_other_uses: true
    lut_mode: ${gray_lut_mode}
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: false
    partial_refresh:
      x: 640
      y: 8
      width: 136
      height: 64
      max_updates: 5
    update_interval: never
    pages:
      - id: guesty_welcome_page
        lambda: |-
          const auto draw_lines = [&](int x, int y, const std::string &text,
                                      esphome::font::Font *font,
                                      int line_height, int maximum_lines) {
            size_t start = 0;
            int line = 0;
            while (start <= text.size() && line < maximum_lines) {
              const size_t end = text.find('\n', start);
              const std::string part = text.substr(
                  start, end == std::string::npos ? std::string::npos : end - start);
              it.print(x, y + line * line_height, font, part.c_str());
              line++;
              if (end == std::string::npos) break;
              start = end + 1;
            }
          };
          const auto clipped = [](const std::string &value, size_t maximum) {
            size_t index = 0;
            size_t codepoints = 0;
            size_t prefix_end = 0;
            while (index < value.size() && codepoints < maximum) {
              const uint8_t first = static_cast<uint8_t>(value[index]);
              size_t width = 1;
              if ((first & 0xE0) == 0xC0) width = 2;
              else if ((first & 0xF0) == 0xE0) width = 3;
              else if ((first & 0xF8) == 0xF0) width = 4;
              if (index + width > value.size()) break;
              index += width;
              prefix_end = index;
              codepoints++;
            }
            if (prefix_end == value.size()) return value;
            if (maximum <= 1) return std::string("…");

            // Recalculate one code point less so the ellipsis stays inside the
            // requested visual character budget without splitting UTF-8.
            index = 0;
            codepoints = 0;
            prefix_end = 0;
            while (index < value.size() && codepoints < maximum - 1) {
              const uint8_t first = static_cast<uint8_t>(value[index]);
              size_t width = 1;
              if ((first & 0xE0) == 0xC0) width = 2;
              else if ((first & 0xF0) == 0xE0) width = 3;
              else if ((first & 0xF8) == 0xF0) width = 4;
              if (index + width > value.size()) break;
              index += width;
              prefix_end = index;
              codepoints++;
            }
            return value.substr(0, prefix_end) + "…";
          };

          const auto utf8_codepoints = [](const std::string &value) {
            size_t count = 0;
            for (const unsigned char character : value) {
              if ((character & 0xC0) != 0x80) count++;
            }
            return count;
          };

          const auto detail_value_x = [&](const std::string &label) {
            const size_t offset = std::min<size_t>(96,
                12 + utf8_codepoints(label) * 9);
            return 432 + static_cast<int>(offset);
          };

          const auto draw_rounded_panel = [&](int x, int y, int width,
                                               int height, int radius) {
            const Color light_gray(85, 85, 85);
            it.filled_rectangle(x + radius, y, width - radius * 2,
                                height, light_gray);
            it.filled_rectangle(x, y + radius, width,
                                height - radius * 2, light_gray);
            it.filled_circle(x + radius, y + radius, radius, light_gray);
            it.filled_circle(x + width - radius - 1, y + radius,
                             radius, light_gray);
            it.filled_circle(x + radius, y + height - radius - 1,
                             radius, light_gray);
            it.filled_circle(x + width - radius - 1,
                             y + height - radius - 1, radius, light_gray);
          };

          const auto weather_icon = [](const std::string &condition) {
            if (condition == "sunny") return "\U000F0599";
            if (condition == "clear-night") return "\U000F0594";
            if (condition == "fog") return "\U000F0591";
            if (condition == "hail") return "\U000F0592";
            if (condition == "lightning") return "\U000F0593";
            if (condition == "lightning-rainy") return "\U000F067E";
            if (condition == "partlycloudy") return "\U000F0595";
            if (condition == "pouring") return "\U000F0596";
            if (condition == "rainy") return "\U000F0597";
            if (condition == "snowy") return "\U000F0598";
            if (condition == "snowy-rainy") return "\U000F067F";
            if (condition == "windy") return "\U000F059D";
            if (condition == "windy-variant") return "\U000F059E";
            if (condition == "exceptional") return "\U000F002A";
            return "\U000F0590";
          };

          // Header
          it.print(32, 24, id(guesty_font_property),
                   id(guesty_property_name).c_str());
          if (id(guesty_has_weather)) {
            it.print(650, 12, id(guesty_font_weather_icon),
                     weather_icon(id(guesty_weather_condition)));
            it.print(768, 27, id(guesty_font_weather_temperature),
                     TextAlign::TOP_RIGHT,
                     id(guesty_weather_temperature).c_str());
          }
          esphome::font::Font *title_font = id(guesty_welcome_title).size() > 24
              ? id(guesty_font_welcome_small)
              : id(guesty_font_welcome);
          it.print(32, 52, title_font, id(guesty_welcome_title).c_str());
          it.line(32, 116, 768, 116);

          // Welcome copy
          draw_lines(32, 142, id(guesty_welcome_text),
                     id(guesty_font_body), 28, 3);

          // Design 2: two equal, borderless access panels.
          if (!id(guesty_door_code).empty()) {
            draw_rounded_panel(32, 242, 360, 136, 12);
            it.print(56, 260, id(guesty_font_label),
                     id(guesty_door_code_label).c_str());
            esphome::font::Font *code_font = id(guesty_door_code).size() > 8
                ? id(guesty_font_door_code_small)
                : id(guesty_font_door_code);
            it.print(56, 292, code_font, id(guesty_door_code).c_str());
          }

          if (id(guesty_has_wifi)) {
            draw_rounded_panel(408, 242, 360, 136, 12);
            it.print(432, 260, id(guesty_font_label),
                     id(guesty_wifi_label).c_str());
            it.print(432, 304, id(guesty_font_detail_bold),
                     id(guesty_wifi_name_label).c_str());
            it.print(detail_value_x(id(guesty_wifi_name_label)), 304,
                     id(guesty_font_detail),
                     clipped(id(guesty_wifi_name), 15).c_str());
            if (!id(guesty_wifi_password).empty()) {
              it.print(432, 334, id(guesty_font_detail_bold),
                       id(guesty_wifi_key_label).c_str());
              it.print(detail_value_x(id(guesty_wifi_key_label)), 334,
                       id(guesty_font_detail),
                       clipped(id(guesty_wifi_password), 15).c_str());
            }

            const int qr_modules = id(guesty_wifi_qr).get_size();
            const int qr_scale = qr_modules > 0
                ? std::max(1, 88 / qr_modules) : 1;
            const int qr_size = qr_modules * qr_scale;
            const int qr_margin = (136 - qr_size) / 2;
            const int qr_x = 768 - qr_margin - qr_size;
            const int qr_y = 242 + qr_margin;
            it.qr_code(qr_x, qr_y, id(guesty_wifi_qr), COLOR_ON, qr_scale);
          }

          // Taller footer with one global, borderless logo shared by every
          // display. The fixed 144x48 canvas contains four packed gray levels.
          it.line(32, 402, 768, 402);
          it.print(32, 430, id(guesty_font_detail),
                   id(guesty_checkout_label).c_str());
          constexpr int logo_width = 144;
          constexpr int logo_height = 48;
          constexpr int logo_x = 624;
          constexpr int logo_y = 416;
          constexpr size_t logo_hex_length =
              logo_width * logo_height / 4 * 2;
          if (id(guesty_logo_data).size() == logo_hex_length) {
            const auto hex_value = [](char character) -> uint8_t {
              if (character >= '0' && character <= '9') {
                return character - '0';
              }
              if (character >= 'a' && character <= 'f') {
                return character - 'a' + 10;
              }
              if (character >= 'A' && character <= 'F') {
                return character - 'A' + 10;
              }
              return 0;
            };
            for (int y = 0; y < logo_height; y++) {
              for (int x = 0; x < logo_width; x++) {
                const size_t pixel = y * logo_width + x;
                const size_t byte_index = pixel / 4;
                const size_t hex_index = byte_index * 2;
                const uint8_t packed =
                    (hex_value(id(guesty_logo_data)[hex_index]) << 4)
                    | hex_value(id(guesty_logo_data)[hex_index + 1]);
                const uint8_t level =
                    (packed >> ((3 - (pixel & 0x03)) * 2)) & 0x03;
                if (level < 3) {
                  const uint8_t ink = (3 - level) * 85;
                  it.draw_pixel_at(logo_x + x, logo_y + y,
                                   Color(ink, ink, ink));
                }
              }
            }
          }

