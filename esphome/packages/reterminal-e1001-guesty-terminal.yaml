qr_code:
  - id: guesty_wifi_qr
    # dump_config() prints this boot-time value. Keep it neutral; the actual
    # guest WiFi payload is assigned only in volatile RAM after setup.
    value: "GuestyTerminal"
    ecc: MEDIUM

spi:
  id: guesty_epaper_spi
  # The AUTO OTP probe temporarily releases and recreates this dedicated bus.
  # Keep it pinned to the same ESP32-S3 host used by the driver restore path.
  interface: spi2
  clk_pin:
    number: GPIO7
    allow_other_uses: true
  mosi_pin:
    number: GPIO9
    allow_other_uses: true
  miso_pin: GPIO8

i2c:
  - id: guesty_i2c
    scl: GPIO20
    sda: GPIO19
  # The E1001 power schematic connects the SY6974B charger at 0x6B to this
  # separate bus. REG0A.BUS_GD identifies an attached USB/VBUS input.
  - id: guesty_power_i2c
    scl: GPIO40
    sda: GPIO39
    scan: false
    frequency: 100kHz

# Seeed's onboard E1001 microphone is a PDM device. GPIO42 supplies its clock,
# GPIO41 carries sample data, and GPIO38 switches the microphone power rail.
# Capture is controlled by External power below, so this bus consumes no audio
# processing time during a battery wake.
i2s_audio:
  - id: guesty_microphone_i2s
    i2s_lrclk_pin: GPIO42

microphone:
  - platform: i2s_audio
    id: guesty_microphone
    i2s_audio_id: guesty_microphone_i2s
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41
    # Seeed's working E1001 reference initializes its mono PDM receiver with
    # I2S_PDM_SLOT_LEFT. ESPHome otherwise defaults an omitted channel to the
    # right slot, which does not match this board's reference path and can
    # leave the RMS result non-finite.
    channel: left
    correct_dc_offset: true

output:
  - platform: gpio
    id: guesty_battery_enable
    pin: GPIO21
  - platform: gpio
    id: guesty_status_led
    pin:
      number: GPIO6
      inverted: true
  - platform: gpio
    id: guesty_buzzer
    pin: GPIO45
  - platform: gpio
    id: guesty_microphone_power
    pin: GPIO38
  # The E1001 SD rail is switched by an active-high TPS22916 on GPIO16. Its
  # internal pulldown normally keeps an unused socket off; driving it low makes
  # that state explicit during every boot and battery sleep path.
  - platform: gpio
    id: guesty_sd_power
    pin: GPIO16

sensor:
  - platform: adc
    id: guesty_battery_voltage
    pin: GPIO1
    name: Battery voltage
    internal: ${advanced_diagnostics_internal}
    entity_category: diagnostic
    update_interval: never
    attenuation: 12db
    samples: 16
    sampling_mode: avg
    filters:
      - multiply: 2.0
  - platform: template
    id: guesty_battery_level
    name: Battery level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:battery
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // REG08 reports charge completion but not voltage or remaining capacity.
      // Use it only to resolve the fully charged endpoint on an identified
      // v1.2 board; every other state keeps the measured ADC estimate.
      const bool charge_complete = id(guesty_charge_status_code) == 3
          && id(guesty_external_power).has_state()
          && id(guesty_external_power).state;
      return charge_complete ? 4.15f : id(guesty_battery_voltage).state;
    filters:
      - calibrate_linear:
          # Battery voltage is deliberately non-linear. ESPHome otherwise
          # defaults to one least-squares line and ignores these points as a
          # piecewise discharge curve.
          method: exact
          datapoints:
            - 3.27 -> 0.0
            - 3.30 -> 5.0
            - 3.41 -> 10.0
            - 3.49 -> 20.0
            - 3.58 -> 30.0
            - 3.68 -> 40.0
            - 3.75 -> 50.0
            - 3.80 -> 60.0
            - 3.85 -> 70.0
            - 3.91 -> 80.0
            - 3.96 -> 90.0
            - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: template
    id: guesty_awake_duration
    name: Awake duration
    internal: ${advanced_diagnostics_internal}
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:timer-outline
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: return millis() / 1000.0f;
  - platform: sht4x
    id: guesty_environment
    i2c_id: guesty_i2c
    # High precision is ESPHome's current default, but spelling it out keeps a
    # future dependency update from silently changing the measurement mode.
    # The on-chip heater is for condensation recovery only; normal indoor
    # measurements must not warm the sensing element.
    precision: High
    heater_max_duty: 0.0
    temperature:
      name: Temperature
      entity_category: diagnostic
      accuracy_decimals: 1
      filters:
        - offset: ${environment_temperature_offset}
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
            send_first_at: 1
    humidity:
      name: Relative humidity
      entity_category: diagnostic
      accuracy_decimals: 1
      filters:
        - offset: ${environment_humidity_offset}
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
            send_first_at: 1
        - clamp:
            min_value: 0.0
            max_value: 100.0
    update_interval: never
  # ESPHome computes RMS from every sample in one complete 30-second window
  # and publishes one result immediately before starting the next window.
  # The result is relative dB (0 dB is the microphone's digital full scale),
  # not an uncalibrated claim of absolute dB(A). Passive mode also guarantees
  # that no microphone capture is started independently from the power gate.
  - platform: sound_level
    id: guesty_sound_level
    passive: true
    measurement_duration: 30s
    microphone:
      microphone: guesty_microphone
    rms:
      id: guesty_sound_level_30_seconds
      name: Relativer Schallpegel (30 Sekunden)
      icon: mdi:volume-high
      on_value:
        then:
          - if:
              condition:
                lambda: |-
                  return id(guesty_external_power).has_state()
                      && id(guesty_external_power).state
                      && id(guesty_microphone).is_running()
                      && std::isfinite(x);
              then:
                - lambda: id(guesty_microphone_status_value) = "running";
                - component.update: guesty_microphone_status

text_sensor:
  # This state is evaluated once per boot and lets Home Assistant distinguish
  # the intended 30-minute timer from an accidental button/wake-pin loop.
  - platform: template
    id: guesty_wake_reason
    name: Wake-up reason
    internal: ${advanced_diagnostics_internal}
    icon: mdi:power-sleep
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      switch (esp_sleep_get_wakeup_cause()) {
        case ESP_SLEEP_WAKEUP_TIMER:
          return {"timer"};
        case ESP_SLEEP_WAKEUP_EXT0:
        case ESP_SLEEP_WAKEUP_EXT1:
        case ESP_SLEEP_WAKEUP_GPIO:
          return {"button"};
        case ESP_SLEEP_WAKEUP_UNDEFINED:
          return {"cold_boot"};
        default:
          return {"other"};
      }
  # Wake-up cause describes deep-sleep entry; reset reason distinguishes a
  # normal boot from software restarts, watchdogs, crashes and brownouts.
  - platform: template
    id: guesty_reset_reason
    name: Reset reason
    internal: ${advanced_diagnostics_internal}
    icon: mdi:restart-alert
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:
          return {"power_on"};
        case ESP_RST_SW:
          return {"software"};
        case ESP_RST_PANIC:
          return {"panic"};
        case ESP_RST_INT_WDT:
        case ESP_RST_TASK_WDT:
        case ESP_RST_WDT:
          return {"watchdog"};
        case ESP_RST_BROWNOUT:
          return {"brownout"};
        case ESP_RST_DEEPSLEEP:
          return {"deep_sleep"};
        default:
          return {"other"};
      }
  # Identifies which revision-safe signal produced External power. The state
  # contains no credentials or user data and changes only when the detector
  # switches between the v1.2 charger, the v1.0 fallback, and no valid signal.
  - platform: template
    id: guesty_power_detection_method
    name: Power detection method
    internal: ${advanced_diagnostics_internal}
    icon: mdi:power-plug-battery
    entity_category: diagnostic
    update_interval: never
  # E1001 v1.2 exposes a charging phase and neutral fault classes through the
  # identified SY6974B. The legacy v1.0 charger has no readable host interface.
  - platform: template
    id: guesty_charging_status
    name: Battery charging status
    icon: mdi:battery-charging
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      switch (id(guesty_charge_status_code)) {
        case -2: return {"unsupported"};
        case 0: return {"not_charging"};
        case 1: return {"pre_charge"};
        case 2: return {"fast_charging"};
        case 3: return {"complete"};
        case 4: return {"charge_fault"};
        case 5: return {"battery_fault"};
        case 6: return {"temperature_limited"};
        default: return {"unavailable"};
      }
  - platform: template
    id: guesty_flash_layout
    name: Flash layout
    internal: ${advanced_diagnostics_internal}
    icon: mdi:memory
    entity_category: diagnostic
    update_interval: never
    lambda: return {"${flash_layout}"};
  # This diagnostic state is published only after a successful physical panel
  # refresh, or when a matching successful content ID is restored after wake.
  - platform: template
    id: guesty_last_booking
    name: Angezeigte Buchung
    icon: mdi:calendar-account
    entity_category: diagnostic
    update_interval: never
  # These values expose only transport/controller phases. Correlation tokens
  # and guest-visible payload fields never become separate HA entities.
  - platform: template
    id: guesty_delivery_status
    name: Display delivery status
    internal: ${advanced_diagnostics_internal}
    icon: mdi:send-check-outline
    entity_category: diagnostic
    update_interval: never
    lambda: return {"idle"};
  - platform: template
    id: guesty_panel_phase
    name: E-paper phase
    internal: ${advanced_diagnostics_internal}
    icon: mdi:progress-wrench
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_epaper).update_phase_name()};
  - platform: template
    id: guesty_panel_error
    name: E-paper error
    internal: ${advanced_diagnostics_internal}
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_epaper).last_error_name()};
  - platform: template
    id: guesty_waveform_mode
    name: E-paper waveform
    internal: ${advanced_diagnostics_internal}
    icon: mdi:sine-wave
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_epaper).active_lut_mode_name()};
  - platform: template
    id: guesty_border_mode
    name: E-paper border mode
    internal: ${advanced_diagnostics_internal}
    icon: mdi:border-outside
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_epaper).border_mode_name()};
  - platform: template
    id: guesty_self_test_status
    name: E-paper self-test
    internal: ${advanced_diagnostics_internal}
    icon: mdi:test-tube
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_self_test_result)};
  - platform: template
    id: guesty_border_recovery_status
    name: E-paper border recovery
    internal: ${advanced_diagnostics_internal}
    icon: mdi:border-outside
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_border_recovery_result)};
  - platform: template
    id: guesty_microphone_status
    name: Microphone status
    internal: ${advanced_diagnostics_internal}
    icon: mdi:microphone-message
    entity_category: diagnostic
    update_interval: never
    lambda: return {id(guesty_microphone_status_value)};
  # The Home Assistant integration discovers this entity. Its state is the
  # exact ESPHome action name to call while this device is awake.
  - platform: template
    id: guesty_terminal_endpoint
    name: GuestyTerminal Endpoint
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      std::string action = "${device_name}_guesty_terminal_update_display_v10";
      for (char &character : action) {
        if (character == '-') character = '_';
      }
      return {action};

binary_sensor:
  - platform: template
    id: guesty_external_power
    name: External power
    device_class: power
    entity_category: diagnostic
    # Only a confirmed physical cable may start the guarded microphone script.
    # A fresh cable connection after component setup always starts a new
    # complete 30-second window. The initial boot-time press is deliberately
    # ignored and handled by the final on_boot stage instead.
    on_press:
      then:
        - if:
            condition:
              lambda: return id(guesty_component_setup_complete);
            then:
              - lambda: id(guesty_microphone_start_attempts) = 0;
              - script.execute: guesty_start_microphone
    on_release:
      then:
        - script.stop: guesty_start_microphone
        - script.stop: guesty_verify_microphone_window
        - microphone.stop_capture: guesty_microphone
        - wait_until:
            condition:
              lambda: return id(guesty_microphone).is_stopped();
            timeout: 500ms
        - output.turn_off: guesty_microphone_power
        - lambda: |-
            id(guesty_microphone_start_attempts) = 0;
            id(guesty_microphone_status_value) = "off_on_battery";
        - component.update: guesty_microphone_status
  - platform: gpio
    id: guesty_button_green
    name: Green button
    entity_category: diagnostic
    pin:
      number: GPIO3
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: guesty_button_middle
    name: Middle button
    entity_category: diagnostic
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: guesty_button_left
    name: Left button
    entity_category: diagnostic
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
