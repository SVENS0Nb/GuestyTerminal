# reTerminal E1001 GuestyTerminal display package
# Target: ESPHome + Home Assistant GuestyTerminal custom integration

psram:
  mode: octal
  speed: 80MHz

esphome:
  on_boot:
    - priority: 600
      then:
        - output.turn_on: guesty_battery_enable
        - delay: 200ms
        - component.update: guesty_battery_voltage
        - delay: 20ms
        - component.update: guesty_battery_level
        - output.turn_off: guesty_battery_enable
        - pcf8563.read_time:
        - component.update: guesty_environment
    - priority: -100
      then:
        - delay: 500ms
        - component.update: guesty_terminal_endpoint
        # E-paper keeps its image without power. Clear an expired guest screen
        # locally even if Home Assistant or Guesty is temporarily unavailable.
        - if:
            condition:
              lambda: |-
                const auto now = id(guesty_rtc).now();
                return id(guesty_screen_sensitive)
                    && id(guesty_valid_until_epoch) > 0
                    && (!now.is_valid()
                        || now.timestamp >= id(guesty_valid_until_epoch));
            then:
              - lambda: |-
                  id(guesty_mode) = "idle";
                  id(guesty_welcome_title) = "Willkommen";
                  id(guesty_welcome_text) =
                      "Die Unterkunft ist für den nächsten Aufenthalt bereit.";
                  id(guesty_door_code).clear();
                  id(guesty_wifi_name).clear();
                  id(guesty_wifi_password).clear();
                  id(guesty_checkout_label).clear();
                  id(guesty_has_wifi) = false;
                  id(guesty_screen_sensitive) = false;
                  id(guesty_valid_until_epoch) = 0;
              - display.page.show: guesty_idle_page
              - component.update: guesty_epaper

api:
  reboot_timeout: 0s
  actions:
    - action: guesty_terminal_update_display
      variables:
        mode: string
        property_name: string
        welcome_title: string
        welcome_text: string
        door_code: string
        wifi_name: string
        wifi_password: string
        checkout_label: string
        valid_until_epoch: int
      then:
        - lambda: |-
            id(guesty_mode) = mode;
            id(guesty_property_name) = property_name;
            id(guesty_welcome_title) = welcome_title;
            id(guesty_welcome_text) = welcome_text;
            id(guesty_door_code) = door_code;
            id(guesty_wifi_name) = wifi_name;
            id(guesty_wifi_password) = wifi_password;
            id(guesty_checkout_label) = checkout_label;
            id(guesty_valid_until_epoch) = valid_until_epoch;
            id(guesty_screen_sensitive) = mode == "welcome";
            id(guesty_has_wifi) =
                mode == "welcome" && !wifi_name.empty();

            if (id(guesty_has_wifi)) {
              const auto escape_wifi = [](const std::string &input) {
                std::string escaped;
                escaped.reserve(input.size() + 8);
                for (const char character : input) {
                  if (character == '\\' || character == ';'
                      || character == ',' || character == ':') {
                    escaped.push_back('\\');
                  }
                  escaped.push_back(character);
                }
                return escaped;
              };
              const std::string security =
                  wifi_password.empty() ? "nopass" : "WPA";
              const std::string qr_value =
                  "WIFI:T:" + security
                  + ";S:" + escape_wifi(wifi_name)
                  + ";P:" + escape_wifi(wifi_password) + ";;";
              id(guesty_wifi_qr).set_value(qr_value);
              id(guesty_wifi_qr).generate_qr_code();
            }
        - if:
            condition:
              lambda: return mode == "welcome";
            then:
              - display.page.show: guesty_welcome_page
            else:
              - display.page.show: guesty_idle_page
        - component.update: guesty_epaper
        - delay: 7s
        - deep_sleep.enter: guesty_deep_sleep

globals:
  - id: guesty_mode
    type: std::string
    initial_value: '"idle"'
  - id: guesty_property_name
    type: std::string
    initial_value: '"UNTERKUNFT"'
  - id: guesty_welcome_title
    type: std::string
    initial_value: '"Willkommen"'
  - id: guesty_welcome_text
    type: std::string
    initial_value: '"Die Unterkunft ist bereit."'
  - id: guesty_door_code
    type: std::string
    initial_value: '""'
  - id: guesty_wifi_name
    type: std::string
    initial_value: '""'
  - id: guesty_wifi_password
    type: std::string
    initial_value: '""'
  - id: guesty_checkout_label
    type: std::string
    initial_value: '""'
  - id: guesty_has_wifi
    type: bool
    initial_value: "false"
  # Only the expiry and sensitive-screen flag survive deep sleep. Door and
  # WiFi credentials deliberately do not get written to flash.
  - id: guesty_valid_until_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: guesty_screen_sensitive
    type: bool
    restore_value: true
    initial_value: "false"

font:
  - file: "gfonts://Inter@500"
    id: guesty_font_property
    size: 16
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Lora@500"
    id: guesty_font_welcome
    size: 46
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Lora@500"
    id: guesty_font_welcome_small
    size: 36
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@400"
    id: guesty_font_body
    size: 20
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@500"
    id: guesty_font_label
    size: 15
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: guesty_font_door_code
    size: 46
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: guesty_font_door_code_small
    size: 32
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: guesty_font_wifi_heading
    size: 28
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@400"
    id: guesty_font_detail
    size: 14
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@500"
    id: guesty_font_detail_bold
    size: 14
    glyphsets:
      - GF_Latin_Core

qr_code:
  - id: guesty_wifi_qr
    value: "WIFI:T:WPA;S:Guest;P:Guest;;"
    ecc: MEDIUM

spi:
  id: guesty_epaper_spi
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

i2c:
  id: guesty_i2c
  scl: GPIO20
  sda: GPIO19

output:
  - platform: gpio
    id: guesty_battery_enable
    pin: GPIO21

sensor:
  - platform: adc
    id: guesty_battery_voltage
    pin: GPIO1
    name: Battery voltage
    entity_category: diagnostic
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    id: guesty_battery_level
    name: Battery level
    unit_of_measurement: "%"
    icon: mdi:battery
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: return id(guesty_battery_voltage).state;
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: sht4x
    id: guesty_environment
    temperature:
      name: Temperature
      entity_category: diagnostic
    humidity:
      name: Relative humidity
      entity_category: diagnostic
    update_interval: never

text_sensor:
  # The Home Assistant integration discovers these entities. Its state is the
  # exact ESPHome action name to call while this device is awake.
  - platform: template
    id: guesty_terminal_endpoint
    name: GuestyTerminal Endpoint
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      std::string action = "${device_name}_guesty_terminal_update_display";
      for (char &character : action) {
        if (character == '-') character = '_';
      }
      return {action};

binary_sensor:
  - platform: gpio
    id: guesty_button_green
    name: Green button
    entity_category: diagnostic
    pin:
      number: GPIO3
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: guesty_button_middle
    name: Middle button
    entity_category: diagnostic
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: guesty_button_left
    name: Left button
    entity_category: diagnostic
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

time:
  - platform: pcf8563
    id: guesty_rtc
    address: 0x51
    update_interval: never
  - platform: homeassistant
    id: guesty_ha_time
    on_time_sync:
      then:
        - pcf8563.write_time:

display:
  - platform: waveshare_epaper
    id: guesty_epaper
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    pages:
      - id: guesty_welcome_page
        lambda: |-
          const auto draw_lines = [&](int x, int y, const std::string &text,
                                      esphome::font::Font *font,
                                      int line_height, int maximum_lines) {
            size_t start = 0;
            int line = 0;
            while (start <= text.size() && line < maximum_lines) {
              const size_t end = text.find('\n', start);
              const std::string part = text.substr(
                  start, end == std::string::npos ? std::string::npos : end - start);
              it.print(x, y + line * line_height, font, part.c_str());
              line++;
              if (end == std::string::npos) break;
              start = end + 1;
            }
          };
          const auto clipped = [](const std::string &value, size_t maximum) {
            size_t index = 0;
            size_t codepoints = 0;
            size_t prefix_end = 0;
            while (index < value.size() && codepoints < maximum) {
              const uint8_t first = static_cast<uint8_t>(value[index]);
              size_t width = 1;
              if ((first & 0xE0) == 0xC0) width = 2;
              else if ((first & 0xF0) == 0xE0) width = 3;
              else if ((first & 0xF8) == 0xF0) width = 4;
              if (index + width > value.size()) break;
              index += width;
              prefix_end = index;
              codepoints++;
            }
            if (prefix_end == value.size()) return value;
            if (maximum <= 1) return std::string("…");

            // Recalculate one code point less so the ellipsis stays inside the
            // requested visual character budget without splitting UTF-8.
            index = 0;
            codepoints = 0;
            prefix_end = 0;
            while (index < value.size() && codepoints < maximum - 1) {
              const uint8_t first = static_cast<uint8_t>(value[index]);
              size_t width = 1;
              if ((first & 0xE0) == 0xC0) width = 2;
              else if ((first & 0xF0) == 0xE0) width = 3;
              else if ((first & 0xF8) == 0xF0) width = 4;
              if (index + width > value.size()) break;
              index += width;
              prefix_end = index;
              codepoints++;
            }
            return value.substr(0, prefix_end) + "…";
          };

          // Header
          it.print(32, 24, id(guesty_font_property),
                   id(guesty_property_name).c_str());
          esphome::font::Font *title_font = id(guesty_welcome_title).size() > 24
              ? id(guesty_font_welcome_small)
              : id(guesty_font_welcome);
          it.print(32, 52, title_font, id(guesty_welcome_title).c_str());
          it.line(32, 116, 768, 116);

          // Welcome copy
          draw_lines(32, 142, id(guesty_welcome_text),
                     id(guesty_font_body), 28, 3);

          // Compact door-code field
          if (!id(guesty_door_code).empty()) {
            it.rectangle(32, 250, 345, 105);
            it.print(48, 263, id(guesty_font_label), "DEIN TÜRCODE");
            esphome::font::Font *code_font = id(guesty_door_code).size() > 8
                ? id(guesty_font_door_code_small)
                : id(guesty_font_door_code);
            it.print(48, 287, code_font, id(guesty_door_code).c_str());
          }

          // WiFi panel
          if (id(guesty_has_wifi)) {
            constexpr int wifi_center_x = 660;
            it.print(wifi_center_x, 132, id(guesty_font_wifi_heading),
                     TextAlign::TOP_CENTER, "WiFi");
            const int qr_scale = 4;
            const int qr_size = id(guesty_wifi_qr).get_size() * qr_scale;
            const int qr_x = wifi_center_x - qr_size / 2;
            const int qr_y = 176;
            it.filled_rectangle(qr_x - 10, qr_y - 10,
                                qr_size + 20, qr_size + 20, COLOR_OFF);
            it.rectangle(qr_x - 10, qr_y - 10,
                         qr_size + 20, qr_size + 20, COLOR_ON);
            it.qr_code(qr_x, qr_y, id(guesty_wifi_qr), COLOR_ON, qr_scale);

            const int details_y = qr_y + qr_size + 17;
            it.print(wifi_center_x, details_y, id(guesty_font_detail_bold),
                     TextAlign::TOP_CENTER,
                     clipped(id(guesty_wifi_name), 27).c_str());
            if (!id(guesty_wifi_password).empty()) {
              it.print(wifi_center_x, details_y + 20, id(guesty_font_detail),
                       TextAlign::TOP_CENTER,
                       clipped(id(guesty_wifi_password), 27).c_str());
            }
          }

          // Footer
          it.line(32, 430, 768, 430);
          it.print(32, 445, id(guesty_font_detail),
                   id(guesty_checkout_label).c_str());
          it.print(768, 445, id(guesty_font_detail_bold),
                   TextAlign::TOP_RIGHT, "Bei Fragen sind wir für dich da.");

      - id: guesty_idle_page
        lambda: |-
          it.print(400, 135, id(guesty_font_property),
                   TextAlign::TOP_CENTER,
                   id(guesty_property_name).c_str());
          it.print(400, 185, id(guesty_font_welcome),
                   TextAlign::TOP_CENTER, "Willkommen");
          it.line(220, 255, 580, 255);
          it.print(400, 285, id(guesty_font_body),
                   TextAlign::TOP_CENTER,
                   "Die Unterkunft ist für den nächsten");
          it.print(400, 315, id(guesty_font_body),
                   TextAlign::TOP_CENTER, "Aufenthalt bereit.");

deep_sleep:
  id: guesty_deep_sleep
  run_duration: 45s
  sleep_duration: 5min
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        allow_other_uses: true
        mode: INPUT_PULLUP
    mode: ANY_LOW
