            };
            for (int y = 0; y < logo_height; y++) {
              for (int x = 0; x < logo_width; x++) {
                const size_t pixel = y * logo_width + x;
                const size_t byte_index = pixel / 4;
                const size_t hex_index = byte_index * 2;
                const uint8_t packed =
                    (hex_value(id(guesty_logo_data)[hex_index]) << 4)
