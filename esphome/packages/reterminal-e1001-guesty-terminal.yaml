# reTerminal E1001 GuestyTerminal display package
# Target: ESPHome + Home Assistant GuestyTerminal custom integration

substitutions:
  power_mode: auto
  battery_sleep_duration: 30min
  awake_duration_seconds: "90"
  gray_lut_mode: auto
  # The lighter profile is a bounded hardware experiment. It selects the
  # register LUT path and extends only the final light-gray VDL drive by two
  # frames; the standard profile retains the unmodified Seeed waveform.
  gray_waveform_profile: lighter
  # A mild display tone curve shifts the thresholds between the four physical
  # levels while keeping black/white exact. Every pixel still uses one native
  # level; no spatial halftone is applied to surfaces or font antialiasing.
  gray_gamma: "1.35"
  # The onboard SHT40 is factory-calibrated. Keep per-device corrections at
  # zero until a stable comparison with a suitable room reference proves a
  # repeatable installed-system offset.
  environment_temperature_offset: "0.0"
  environment_humidity_offset: "0.0"
  # Keep the normal Home Assistant device page focused on everyday controls.
  # Set this to "false" temporarily when advanced hardware diagnostics are
  # needed; the entities continue to exist locally in either mode.
  advanced_diagnostics_internal: "true"
  # Existing OTA configurations without this substitution use ESPHome's
  # historic 4 MB layout. Newly USB-installed devices may select expanded_32mb.
  flash_layout: legacy_4mb

psram:
  mode: octal
  speed: 80MHz

# ESPHome's QR encoder uses an approximately 4 KiB temporary stack buffer on
# ESP32. Payload actions also keep the versioned display arguments alive while
# the page is rendered. Give the main loop enough headroom so a welcome-screen
# QR generation cannot overflow the default 8 KiB stack between the received
# and rendering acknowledgements.
esp32:
  framework:
    advanced:
      loop_task_stack_size: 16384

esphome:
  # ESPHome's qr_code component normally resolves this MIT-licensed library
  # through the PlatformIO registry. Pin the byte-equivalent upstream source
  # so firmware builds do not depend on that registry's availability.
  libraries:
    - "wjtje/qr-code-generator-library=https://github.com/wjtje/QR-Code-generator-esphome.git#5f7449c095cf975bb14a34e1813b191205f78ccb"
  on_boot:
    - priority: 750
      then:
        # Stop UART0 from phantom-powering an unplugged USB-UART bridge while
        # the board revision and cable state are still unknown.
        - script.execute: guesty_quiesce_uart0
        - script.wait: guesty_quiesce_uart0
    - priority: 700
      then:
        # Keep every user-visible/audible peripheral off during startup. The
        # microphone is enabled later only after external power is confirmed.
        # The SY6974B STAT output drives the red charging LED independently
        # from GPIO6, so its pin function is disabled over the charger's
        # dedicated I2C bus too.
        - output.turn_off: guesty_status_led
        - output.turn_off: guesty_buzzer
        - output.turn_off: guesty_microphone_power
        - output.turn_off: guesty_sd_power
        - lambda: |-
            auto *bus = id(guesty_power_i2c);
            uint8_t reg = 0x0B;
            uint8_t part_id = 0;
            if (bus->write_readv(0x6B, &reg, 1, &part_id, 1)
                    != esphome::i2c::ERROR_OK
                || (part_id & 0x78) != 0x40) {
              // E1001 v1.0 uses an ETA6003 without I2C. Do not write to an
              // unverified device that happens to share the touch-panel bus.
              return;
            }
            id(guesty_sy6974_seen_this_boot) = true;
            reg = 0x05;
            uint8_t value = 0;
            if (bus->write_readv(0x6B, &reg, 1, &value, 1)
                == esphome::i2c::ERROR_OK) {
              // Disable the charger watchdog so STAT_DIS remains effective.
              value &= 0xCF;
              const uint8_t payload[] = {reg, value};
              bus->write(0x6B, payload, sizeof(payload));
            }
            reg = 0x00;
            if (bus->write_readv(0x6B, &reg, 1, &value, 1)
                == esphome::i2c::ERROR_OK) {
              // REG00 STAT_DIS[1:0] = 11: charging LED output floats/off.
              value |= 0x60;
              const uint8_t payload[] = {reg, value};
              bus->write(0x6B, payload, sizeof(payload));
            }
    - priority: 600
      then:
        - output.turn_on: guesty_battery_enable
        - delay: 200ms
        - component.update: guesty_battery_voltage
        - delay: 20ms
        - component.update: guesty_battery_level
        - output.turn_off: guesty_battery_enable
        - pcf8563.read_time:
        - component.update: guesty_environment
    # Establish the cable state before WiFi/API can deliver a payload. A late
    # first reading could otherwise make an auto-mode device on USB take the
    # fail-safe battery path during a very fast Home Assistant reconnect.
    - priority: 500
      then:
        # WCH specifies a short power-on-reset interval. Waiting here also
        # keeps a hostless wall adapter and a USB data host on the same path.
        - delay: 100ms
        - script.execute: guesty_read_external_power
        - script.wait: guesty_read_external_power
    - priority: -100
      then:
        - component.update: guesty_wake_reason
        - component.update: guesty_reset_reason
        - component.update: guesty_panel_phase
        - component.update: guesty_panel_error
        - component.update: guesty_waveform_mode
        - component.update: guesty_border_mode
        - component.update: guesty_delivery_status
        - component.update: guesty_flash_layout
        - component.update: guesty_self_test_status
        - component.update: guesty_border_recovery_status
        - component.update: guesty_charging_status
        - component.update: guesty_microphone_status
        # Only now allow microphone capture. The passive sound-level component
        # registers its data callback at a later setup priority than the first
        # power probe, so starting from that early on_press event can leave the
        # I2S task without its consumer. Cable events after boot use the same
        # guarded start path below.
        - lambda: |-
            id(guesty_component_setup_complete) = true;
            id(guesty_microphone_start_attempts) = 0;
        - if:
            condition:
              lambda: |-
                return id(guesty_external_power).has_state()
                    && id(guesty_external_power).state;
            then:
              - if:
                  condition:
                    lambda: return id(guesty_microphone).is_running();
                  then:
                    - script.execute: guesty_verify_microphone_window
                  else:
                    - script.execute: guesty_start_microphone
        - delay: 500ms
        - component.update: guesty_terminal_endpoint

api:
  reboot_timeout: 0s
  # Delivery acknowledgements are low-frequency but latency-sensitive. Send
  # endpoint pulses immediately so Home Assistant observes "received" before
  # the asynchronous panel transaction starts.
  batch_delay: 0ms
  # Authentication finishes before Home Assistant has subscribed to entity
  # states. Wait for that subscription before pulsing the endpoint; otherwise
  # both this pulse and the restored action state can be lost during a short
  # battery wake or a noisy reconnect.
  on_client_connected:
    then:
      - if:
          condition:
            lambda: |-
              return client_info.find("Home Assistant")
                  != std::string::npos;
          then:
            - wait_until:
                condition:
                  api.connected:
                    state_subscription_only: true
                timeout: 20s
            - if:
                condition:
                  api.connected:
                    state_subscription_only: true
                then:
                  # Replay the last in-RAM delivery phase before the normal
                  # reconnect pulse. A connection loss during a physical
                  # refresh can therefore still complete the matching Home
                  # Assistant delivery waiter after reconnecting.
                  - if:
                      condition:
                        lambda: return !id(guesty_last_delivery_state).empty();
                      then:
                        - lambda: |-
                            id(guesty_terminal_endpoint).publish_state(
                                id(guesty_last_delivery_state));
                        - delay: 300ms
                  - text_sensor.template.publish:
                      id: guesty_terminal_endpoint
                      state: "__guesty_reconnecting__"
                  - delay: 1s
                  - component.update: guesty_terminal_endpoint
  actions:
    # v10 is the acknowledged transport. It keeps the v9 visible payload
    # schema and adds only a random correlation token. Home Assistant can
    # therefore distinguish submission, rendering and physical completion.
    # The action itself is deliberately fire-and-forget: ESPHome action
    # responses have a shorter client timeout than a safe E-paper refresh.
    # The endpoint pulses below are the sole delivery acknowledgement.
    - action: guesty_terminal_update_display_v10
      supports_response: none
      variables:
        mode: string
        property_name: string
        welcome_title: string
        welcome_text: string
        door_code: string
        wifi_name: string
        wifi_password: string
        checkout_label: string
        door_code_label: string
        wifi_label: string
        wifi_name_label: string
        wifi_key_label: string
        idle_title: string
        idle_text: string
        no_active_booking_label: string
        checkout_instructions_title: string
        checkout_instructions: string
        next_booking_title: string
        next_booking_guest: string
        next_booking_period: string
        general_notes_label: string
        general_notes: string
        cleaner_notes_label: string
        cleaner_notes: string
        special_requests_label: string
        special_requests: string
        valid_until_epoch: int
        content_id: string
        base_content_id: string
        force_redraw: bool
        logo_data: string
        booking_summary: string
        weather_condition: string
        weather_temperature: string
        delivery_id: string
      then:
        # Never queue several credential-bearing payload handlers. The Home
        # Assistant runtime coalesces pending requests and retries the newest
        # one after this bounded busy response.
        - if:
            condition:
              lambda: |-
                return id(guesty_delivery_handler_busy)
                    || id(guesty_self_test_active);
            then:
              - lambda: |-
                  bool valid_delivery_id = delivery_id.size() == 24;
                  for (const char character : delivery_id) {
                    valid_delivery_id = valid_delivery_id
                        && ((character >= '0' && character <= '9')
                            || (character >= 'a' && character <= 'f'));
                  }
                  const std::string safe_delivery_id = valid_delivery_id
                      ? delivery_id : std::string(24, '0');
                  const std::string state =
                      "__guesty_delivery_error__:" + safe_delivery_id + ":busy";
                  id(guesty_last_delivery_state) = state;
                  id(guesty_terminal_endpoint).publish_state(state);
                  id(guesty_delivery_status).publish_state("busy");
              - delay: 250ms
              - component.update: guesty_terminal_endpoint
            else:
              - lambda: |-
                  bool valid_delivery_id = delivery_id.size() == 24;
                  for (const char character : delivery_id) {
                    valid_delivery_id = valid_delivery_id
                        && ((character >= '0' && character <= '9')
                            || (character >= 'a' && character <= 'f'));
                  }
                  id(guesty_active_delivery_id) = valid_delivery_id
                      ? delivery_id : std::string(24, '0');
                  id(guesty_delivery_handler_busy) = true;
                  id(guesty_delivery_result) = false;
                  id(guesty_delivery_unchanged) = false;
                  id(guesty_failed_content_suppressed) = false;
                  id(guesty_delivery_error).clear();
                  const std::string state =
                      "__guesty_delivery_received__:"
                      + id(guesty_active_delivery_id);
                  id(guesty_last_delivery_state) = state;
                  id(guesty_terminal_endpoint).publish_state(state);
                  id(guesty_delivery_status).publish_state("received");
              # Yield after the immediate endpoint publication. This keeps a
              # later rendering state or panel failure from coalescing away
              # the transport receipt on slower Home Assistant connections.
              - delay: 150ms
              # A local privacy clear or legacy v9 refresh may already own the
              # panel. Return a bounded preparation error quickly so the Home
              # Assistant retry path can take over without exceeding its
              # end-to-end completion deadline.
              - wait_until:
                  condition:
                    lambda: return !id(guesty_epaper).update_in_progress();
                  timeout: 5s
              - if:
                  condition:
                    lambda: return id(guesty_epaper).update_in_progress();
                  then:
                    - lambda: |-
                        id(guesty_delivery_error) = "preparation_timeout";
                  else:
                    - lambda: |-
                        const bool renderer_current =
                            id(guesty_render_revision) == 37;
                        const int configured_gray_gamma_x100 =
                            static_cast<int>(std::lround(
                                ${gray_gamma} * 100.0f));
                        const bool tone_curve_current =
                            id(guesty_rendered_gray_gamma_x100)
                                == configured_gray_gamma_x100;
                        const bool waveform_profile_current =
                            id(guesty_rendered_waveform_profile)
                                == id(guesty_epaper).waveform_profile_id();
                        const bool confirmed_external_power =
                            id(guesty_external_power).has_state()
                            && id(guesty_external_power).state;
                        const bool border_conditioning_needed =
                            confirmed_external_power
                            && id(guesty_border_conditioning_revision) != 1;
                        int battery_percent = -1;
                        if (id(guesty_battery_level).has_state()
                            && std::isfinite(id(guesty_battery_level).state)) {
                          const int rounded = static_cast<int>(
                              std::lround(id(guesty_battery_level).state));
                          battery_percent = std::max(0, std::min(100,
                              ((rounded + 2) / 5) * 5));
                        }
                        const bool empty_page =
                            mode != "welcome" && mode != "checkout";
                        const bool battery_charging =
                            confirmed_external_power
                            && (id(guesty_charge_status_code) == 1
                                || id(guesty_charge_status_code) == 2);
                        const bool battery_changed = empty_page
                            && battery_percent >= 0
                            && (battery_percent !=
                                    id(guesty_rendered_battery_percent)
                                || battery_charging !=
                                    id(guesty_rendered_battery_charging));
                        id(guesty_content_changed) = force_redraw
                            || content_id.empty()
                            || content_id != id(guesty_content_id)
                            || !renderer_current
                            || !tone_curve_current
                            || !waveform_profile_current
                            || border_conditioning_needed
                            || battery_changed;
                        id(guesty_failed_content_suppressed) =
                            id(guesty_content_changed)
                            && !force_redraw
                            && !border_conditioning_needed
                            && !content_id.empty()
                            && content_id == id(guesty_failed_content_id);
                        id(guesty_delivery_unchanged) =
                            !id(guesty_content_changed);
                        id(guesty_weather_only_changed) =
                            id(guesty_content_changed)
                            && !force_redraw
                            && renderer_current
                            && tone_curve_current
                            && waveform_profile_current
                            && !content_id.empty()
                            && !base_content_id.empty()
                            && base_content_id == id(guesty_base_content_id)
                            && !empty_page;
                        id(guesty_battery_only_changed) = battery_changed
                            && !force_redraw
                            && renderer_current
                            && tone_curve_current
                            && waveform_profile_current
                            && !content_id.empty()
                            && content_id == id(guesty_content_id);
                        id(guesty_privacy_clear_pending) =
                            mode == "idle" && id(guesty_content_changed);
                        id(guesty_display_battery_percent) = battery_percent;
                        id(guesty_display_battery_charging) = battery_charging;
                        id(guesty_mode) = mode;
                        id(guesty_property_name) = property_name;
                        id(guesty_welcome_title) = welcome_title;
                        id(guesty_welcome_text) = welcome_text;
                        id(guesty_door_code) = door_code;
                        id(guesty_wifi_name) = wifi_name;
                        id(guesty_wifi_password) = wifi_password;
                        id(guesty_checkout_label) = checkout_label;
                        id(guesty_door_code_label) = door_code_label;
                        id(guesty_wifi_label) = wifi_label;
                        id(guesty_wifi_name_label) = wifi_name_label;
                        id(guesty_wifi_key_label) = wifi_key_label;
                        id(guesty_idle_title) = idle_title;
                        id(guesty_idle_text) = idle_text;
                        id(guesty_no_active_booking_label) =
                            no_active_booking_label;
                        id(guesty_checkout_instructions_title) =
                            checkout_instructions_title;
                        id(guesty_checkout_instructions) = checkout_instructions;
                        id(guesty_next_booking_title) = next_booking_title;
                        id(guesty_next_booking_guest) = next_booking_guest;
                        id(guesty_next_booking_period) = next_booking_period;
                        id(guesty_general_notes_label) = general_notes_label;
                        id(guesty_general_notes) = general_notes;
                        id(guesty_cleaner_notes_label) = cleaner_notes_label;
                        id(guesty_cleaner_notes) = cleaner_notes;
                        id(guesty_special_requests_label) =
                            special_requests_label;
                        id(guesty_special_requests) = special_requests;
                        id(guesty_logo_data) = logo_data;
                        id(guesty_weather_condition) = weather_condition;
                        id(guesty_weather_temperature) = weather_temperature;
                        id(guesty_has_wifi) =
                            mode == "welcome" && !wifi_name.empty();
                        id(guesty_has_weather) =
                            (mode == "welcome" || mode == "checkout")
                            && (!weather_condition.empty()
                                || !weather_temperature.empty());

                        if (id(guesty_content_changed)
                            && id(guesty_has_wifi)) {
                          const auto escape_wifi =
                              [](const std::string &input) {
                            std::string escaped;
                            escaped.reserve(input.size() + 8);
                            for (const char character : input) {
                              if (character == '\\' || character == ';'
                                  || character == ',' || character == ':') {
                                escaped.push_back('\\');
                              }
                              escaped.push_back(character);
                            }
                            return escaped;
                          };
                          const std::string security =
                              wifi_password.empty() ? "nopass" : "WPA";
                          const std::string qr_value =
                              "WIFI:T:" + security
                              + ";S:" + escape_wifi(wifi_name)
                              + ";P:" + escape_wifi(wifi_password) + ";;";
                          // Generation is intentionally deferred to the display
                          // renderer. ESPHome's get_size() generates the code
                          // once and clears its dirty flag; doing it here would
                          // allocate the large temporary buffer twice and on a
                          // deeper API-action stack.
                          id(guesty_wifi_qr).set_value(qr_value);
                        }
                        const std::string state =
                            "__guesty_delivery_rendering__:"
                            + id(guesty_active_delivery_id);
                        id(guesty_last_delivery_state) = state;
                        id(guesty_terminal_endpoint).publish_state(state);
                        id(guesty_delivery_status).publish_state("rendering");
                    # Page selection is volatile and must be restored even
                    # when the retained fingerprint suppresses panel I/O.
                    - if:
                        condition:
                          lambda: return mode == "checkout";
                        then:
                          - display.page.show: guesty_checkout_page
                        else:
                          - if:
                              condition:
                                lambda: return mode == "welcome";
                              then:
                                - display.page.show: guesty_welcome_page
                              else:
                                - display.page.show: guesty_idle_page
                    - if:
                        condition:
                          lambda: |-
                            return id(guesty_content_changed)
                                && !id(guesty_failed_content_suppressed);
                        then:
                          - lambda: |-
                              const bool confirmed_external_power =
                                  id(guesty_external_power).has_state()
                                  && id(guesty_external_power).state;
                              const bool partial_change =
                                  id(guesty_weather_only_changed)
                                  || id(guesty_battery_only_changed);
                              const bool border_conditioning_needed =
                                  confirmed_external_power
                                  && (!partial_change
                                      || id(guesty_border_conditioning_revision)
                                          != 1);
                              id(guesty_border_conditioning_requested) = false;
                              if (border_conditioning_needed) {
                                id(guesty_epaper).request_border_recovery();
                                id(guesty_border_conditioning_requested) = true;
                              } else if (id(guesty_weather_only_changed)
                                         || id(guesty_battery_only_changed)) {
                                id(guesty_epaper).request_partial_update();
                              }
                          - component.update: guesty_epaper
                          # update() builds the framebuffer synchronously before
                          # the hardware worker starts. Remove the credential-
                          # bearing QR payload immediately so a later ESPHome
                          # dump_config() can never print it.
                          - lambda: |-
                              id(guesty_wifi_qr).set_value("GuestyTerminal");
                          - wait_until:
                              condition:
                                lambda: |-
                                  return !id(guesty_epaper).update_in_progress();
                              timeout: 120s
                          - if:
                              condition:
                                lambda: |-
                                  return id(guesty_epaper).update_in_progress();
                              then:
                                - lambda: |-
                                    id(guesty_delivery_error) = "panel_timeout";
                                    id(guesty_failed_content_id) = content_id;
                                    if (id(guesty_border_conditioning_requested)) {
                                      id(guesty_border_conditioning_revision) = 0;
                                    }
                                    id(guesty_border_conditioning_requested) = false;
                              else:
                                - if:
                                    condition:
                                      lambda: |-
                                        return id(guesty_epaper).last_update_successful();
                                    then:
                                      - lambda: |-
                                          id(guesty_content_id) = content_id;
                                          id(guesty_base_content_id) =
                                              base_content_id;
                                          id(guesty_render_revision) = 37;
                                          id(guesty_rendered_gray_gamma_x100) =
                                              static_cast<int>(std::lround(
                                                  ${gray_gamma} * 100.0f));
                                          id(guesty_rendered_waveform_profile) =
                                              id(guesty_epaper).waveform_profile_id();
                                          if (id(guesty_border_conditioning_requested)) {
                                            id(guesty_border_conditioning_revision) =
                                                1;
                                          } else if (!id(guesty_epaper).last_update_was_partial()) {
                                            // A later unconditioned full refresh
                                            // invalidates the physical border proof.
                                            id(guesty_border_conditioning_revision) =
                                                0;
                                          }
                                          id(guesty_border_conditioning_requested) = false;
                                          id(guesty_failed_content_id).clear();
                                          id(guesty_screen_sensitive) =
                                              mode != "idle";
                                          id(guesty_valid_until_epoch) =
                                              mode == "idle"
                                                  ? 0 : valid_until_epoch;
                                          id(guesty_privacy_clear_pending) =
                                              false;
                                          id(guesty_update_received_this_boot) =
                                              true;
                                          id(guesty_delivery_result) = true;
                                          if (mode != "welcome"
                                              && mode != "checkout"
                                              && id(guesty_display_battery_percent)
                                                  >= 0) {
                                            id(guesty_rendered_battery_percent) =
                                                id(guesty_display_battery_percent);
                                            id(guesty_rendered_battery_charging) =
                                                id(guesty_display_battery_charging);
                                          }
                                      - text_sensor.template.publish:
                                          id: guesty_last_booking
                                          state: !lambda return booking_summary;
                                    else:
                                      - lambda: |-
                                          id(guesty_delivery_error) =
                                              "panel_error";
                                          id(guesty_failed_content_id) =
                                              content_id;
                                          if (id(guesty_border_conditioning_requested)) {
                                            id(guesty_border_conditioning_revision) =
                                                0;
                                          }
                                          id(guesty_border_conditioning_requested) =
                                              false;
                                      - logger.log:
                                          level: WARN
                                          format: "E-paper refresh failed; booking confirmation was not published"
                        else:
                          - if:
                              condition:
                                lambda: |-
                                  return id(guesty_failed_content_suppressed);
                              then:
                                # The same visible framebuffer already reached
                                # a deterministic physical panel error during
                                # this boot. Report the failure without flashing
                                # it again. A changed payload, forced refresh or
                                # reboot can start a fresh hardware attempt.
                                - lambda: |-
                                    id(guesty_delivery_unchanged) = false;
                                    id(guesty_delivery_error) = "panel_error";
                                    id(guesty_wifi_qr).set_value(
                                        "GuestyTerminal");
                                - logger.log:
                                    level: WARN
                                    format: "Unchanged payload suppressed after the previous E-paper panel error"
                              else:
                                # The matching retained fingerprint proves this
                                # page was written by an earlier successful
                                # refresh.
                                - text_sensor.template.publish:
                                    id: guesty_last_booking
                                    state: !lambda return booking_summary;
                                - lambda: |-
                                    id(guesty_screen_sensitive) =
                                        mode != "idle";
                                    id(guesty_valid_until_epoch) =
                                        mode == "idle" ? 0 : valid_until_epoch;
                                    id(guesty_privacy_clear_pending) = false;
                                    id(guesty_update_received_this_boot) = true;
                                    id(guesty_delivery_result) = true;
                                - delay: 1200ms
              # Publish the final result before restoring the callable endpoint
              # name. The random token never contains reservation information.
              - component.update: guesty_panel_phase
              - component.update: guesty_panel_error
              - component.update: guesty_waveform_mode
              - component.update: guesty_border_mode
              - lambda: |-
                  std::string status;
                  if (id(guesty_delivery_result)) {
                    if (id(guesty_delivery_unchanged)) {
                      status = "unchanged";
                      id(guesty_last_delivery_state) =
                          "__guesty_delivery_unchanged__:"
                          + id(guesty_active_delivery_id);
                    } else {
                      status = "success";
                      id(guesty_last_delivery_state) =
                          "__guesty_delivery_success__:"
                          + id(guesty_active_delivery_id);
                    }
                  } else {
                    if (id(guesty_delivery_error).empty()) {
                      id(guesty_delivery_error) = "panel_error";
                    }
                    status = id(guesty_delivery_error);
                    id(guesty_last_delivery_state) =
                        "__guesty_delivery_error__:"
                        + id(guesty_active_delivery_id)
                        + ":" + status;
                  }
                  id(guesty_terminal_endpoint).publish_state(
                      id(guesty_last_delivery_state));
                  id(guesty_delivery_status).publish_state(status);
              - delay: 300ms
              # Restore the callable action before the multi-sample power
              # probe. The handler remains busy until that decision finishes,
              # so an overlapping request receives the bounded busy receipt
              # instead of replacing this transaction. Home Assistant also
              # retains the last validated action as a transport-independent
              # fallback if this state publication is ever lost.
              - component.update: guesty_terminal_endpoint
              # Failed payloads stay awake for a retry. A successful battery
              # delivery may use the established shared sleep path.
              - if:
                  condition:
                    lambda: return id(guesty_delivery_result);
                  then:
                    - script.execute: guesty_read_external_power
                    - script.wait: guesty_read_external_power
                    - if:
                        condition:
                          lambda: |-
                            const std::string profile = "${power_mode}";
                            return (profile == "battery"
                                || (profile != "mains"
                                    && (!id(guesty_external_power).has_state()
                                        || !id(guesty_external_power).state)))
                                && !(id(guesty_privacy_clear_pending)
                                    && id(guesty_screen_sensitive));
                        then:
                          - lambda: id(guesty_delivery_handler_busy) = false;
                          - script.execute: guesty_enter_battery_sleep
                        else:
                          - lambda: id(guesty_delivery_handler_busy) = false;
                  else:
                    - lambda: id(guesty_delivery_handler_busy) = false;

    # v9 remains frozen for explicit legacy callers. The endpoint advertises
    # v10 so current integrations always use the acknowledged path above.
    - action: guesty_terminal_update_display_v9
      variables:
        mode: string
        property_name: string
        welcome_title: string
        welcome_text: string
        door_code: string
        wifi_name: string
        wifi_password: string
        checkout_label: string
        door_code_label: string
        wifi_label: string
        wifi_name_label: string
        wifi_key_label: string
        idle_title: string
        idle_text: string
        no_active_booking_label: string
        checkout_instructions_title: string
        checkout_instructions: string
        next_booking_title: string
        next_booking_guest: string
        next_booking_period: string
        general_notes_label: string
        general_notes: string
        cleaner_notes_label: string
        cleaner_notes: string
        special_requests_label: string
        special_requests: string
        valid_until_epoch: int
        content_id: string
        base_content_id: string
        force_redraw: bool
        logo_data: string
        booking_summary: string
        weather_condition: string
        weather_temperature: string
      then:
        # Hardware refreshes run outside ESPHome's main loop so the native API
        # stays responsive. Serialize complete payload handlers before they
        # mutate the shared renderer state or framebuffer.
        - wait_until:
            condition:
              lambda: |-
                return !id(guesty_self_test_active)
                    && !id(guesty_epaper).update_in_progress();
        - lambda: |-
            id(guesty_update_received_this_boot) = true;
            const bool renderer_current = id(guesty_render_revision) == 37;
            const int configured_gray_gamma_x100 =
                static_cast<int>(std::lround(${gray_gamma} * 100.0f));
            const bool tone_curve_current =
                id(guesty_rendered_gray_gamma_x100)
                    == configured_gray_gamma_x100;
            const bool waveform_profile_current =
                id(guesty_rendered_waveform_profile)
                    == id(guesty_epaper).waveform_profile_id();
            const bool confirmed_external_power =
                id(guesty_external_power).has_state()
                && id(guesty_external_power).state;
            const bool border_conditioning_needed =
                confirmed_external_power
                && id(guesty_border_conditioning_revision) != 1;
            int battery_percent = -1;
            if (id(guesty_battery_level).has_state()
                && std::isfinite(id(guesty_battery_level).state)) {
              const int rounded = static_cast<int>(
                  std::lround(id(guesty_battery_level).state));
              battery_percent = std::max(0, std::min(100,
                  ((rounded + 2) / 5) * 5));
            }
            const bool empty_page = mode != "welcome" && mode != "checkout";
            const bool battery_charging = confirmed_external_power
                && (id(guesty_charge_status_code) == 1
                    || id(guesty_charge_status_code) == 2);
            const bool battery_changed = empty_page
                && battery_percent >= 0
                && (battery_percent != id(guesty_rendered_battery_percent)
                    || battery_charging !=
                        id(guesty_rendered_battery_charging));
            id(guesty_content_changed) = force_redraw || content_id.empty()
                || content_id != id(guesty_content_id)
                || !renderer_current
                || !tone_curve_current
                || !waveform_profile_current
                || border_conditioning_needed
                || battery_changed;
            id(guesty_weather_only_changed) = id(guesty_content_changed)
                && !force_redraw
                && renderer_current
                && tone_curve_current
                && waveform_profile_current
                && !content_id.empty()
                && !base_content_id.empty()
                && base_content_id == id(guesty_base_content_id)
                && !empty_page;
            id(guesty_battery_only_changed) = battery_changed
                && !force_redraw
                && renderer_current
                && tone_curve_current
                && waveform_profile_current
                && !content_id.empty()
                && content_id == id(guesty_content_id);
            id(guesty_privacy_clear_pending) =
                mode == "idle" && id(guesty_content_changed);
            id(guesty_display_battery_percent) = battery_percent;
            id(guesty_display_battery_charging) = battery_charging;
            id(guesty_mode) = mode;
            id(guesty_property_name) = property_name;
            id(guesty_welcome_title) = welcome_title;
            id(guesty_welcome_text) = welcome_text;
            id(guesty_door_code) = door_code;
            id(guesty_wifi_name) = wifi_name;
            id(guesty_wifi_password) = wifi_password;
            id(guesty_checkout_label) = checkout_label;
            id(guesty_door_code_label) = door_code_label;
            id(guesty_wifi_label) = wifi_label;
            id(guesty_wifi_name_label) = wifi_name_label;
            id(guesty_wifi_key_label) = wifi_key_label;
            id(guesty_idle_title) = idle_title;
            id(guesty_idle_text) = idle_text;
            id(guesty_no_active_booking_label) = no_active_booking_label;
            id(guesty_checkout_instructions_title) = checkout_instructions_title;
            id(guesty_checkout_instructions) = checkout_instructions;
            id(guesty_next_booking_title) = next_booking_title;
            id(guesty_next_booking_guest) = next_booking_guest;
            id(guesty_next_booking_period) = next_booking_period;
            id(guesty_general_notes_label) = general_notes_label;
            id(guesty_general_notes) = general_notes;
            id(guesty_cleaner_notes_label) = cleaner_notes_label;
            id(guesty_cleaner_notes) = cleaner_notes;
            id(guesty_special_requests_label) = special_requests_label;
            id(guesty_special_requests) = special_requests;
            id(guesty_logo_data) = logo_data;
            id(guesty_weather_condition) = weather_condition;
            id(guesty_weather_temperature) = weather_temperature;
            id(guesty_has_wifi) =
                mode == "welcome" && !wifi_name.empty();
            id(guesty_has_weather) =
                (mode == "welcome" || mode == "checkout")
                && (!weather_condition.empty() || !weather_temperature.empty());

            if (id(guesty_content_changed) && id(guesty_has_wifi)) {
              const auto escape_wifi = [](const std::string &input) {
                std::string escaped;
                escaped.reserve(input.size() + 8);
                for (const char character : input) {
                  if (character == '\\' || character == ';'
                      || character == ',' || character == ':') {
                    escaped.push_back('\\');
                  }
                  escaped.push_back(character);
                }
                return escaped;
              };
              const std::string security =
                  wifi_password.empty() ? "nopass" : "WPA";
              const std::string qr_value =
                  "WIFI:T:" + security
                  + ";S:" + escape_wifi(wifi_name)
                  + ";P:" + escape_wifi(wifi_password) + ";;";
              id(guesty_wifi_qr).set_value(qr_value);
            }
        # Page selection is runtime state and does not survive a reboot. Restore
        # it on every payload, even when the retained content fingerprint proves
        # that no physical E-paper refresh is needed.
        - if:
            condition:
              lambda: return mode == "checkout";
            then:
              - display.page.show: guesty_checkout_page
            else:
              - if:
                  condition:
                    lambda: return mode == "welcome";
                  then:
                    - display.page.show: guesty_welcome_page
                  else:
                    - display.page.show: guesty_idle_page
        - if:
            condition:
              lambda: return id(guesty_content_changed);
            then:
              - lambda: |-
                  const bool confirmed_external_power =
                      id(guesty_external_power).has_state()
                      && id(guesty_external_power).state;
                  const bool partial_change =
                      id(guesty_weather_only_changed)
                      || id(guesty_battery_only_changed);
                  const bool border_conditioning_needed =
                      confirmed_external_power
                      && (!partial_change
                          || id(guesty_border_conditioning_revision) != 1);
                  id(guesty_border_conditioning_requested) = false;
                  if (border_conditioning_needed) {
                    id(guesty_epaper).request_border_recovery();
                    id(guesty_border_conditioning_requested) = true;
                  } else if (id(guesty_weather_only_changed)
                             || id(guesty_battery_only_changed)) {
                    id(guesty_epaper).request_partial_update();
                  }
              - component.update: guesty_epaper
              - lambda: |-
                  id(guesty_wifi_qr).set_value("GuestyTerminal");
              - wait_until:
                  condition:
                    lambda: return !id(guesty_epaper).update_in_progress();
                  timeout: 120s
              - if:
                  condition:
                    lambda: |-
                      return !id(guesty_epaper).update_in_progress()
                          && id(guesty_epaper).last_update_successful();
                  then:
                    - lambda: |-
                        id(guesty_content_id) = content_id;
                        id(guesty_base_content_id) = base_content_id;
                        id(guesty_render_revision) = 37;
                        id(guesty_rendered_gray_gamma_x100) =
                            static_cast<int>(std::lround(
                                ${gray_gamma} * 100.0f));
                        id(guesty_rendered_waveform_profile) =
                            id(guesty_epaper).waveform_profile_id();
                        if (id(guesty_border_conditioning_requested)) {
                          id(guesty_border_conditioning_revision) = 1;
                        } else if (!id(guesty_epaper).last_update_was_partial()) {
                          id(guesty_border_conditioning_revision) = 0;
                        }
                        id(guesty_border_conditioning_requested) = false;
                        id(guesty_screen_sensitive) = mode != "idle";
                        id(guesty_valid_until_epoch) =
                            mode == "idle" ? 0 : valid_until_epoch;
                        id(guesty_privacy_clear_pending) = false;
                        if (mode != "welcome" && mode != "checkout"
                            && id(guesty_display_battery_percent) >= 0) {
                          id(guesty_rendered_battery_percent) =
                              id(guesty_display_battery_percent);
                          id(guesty_rendered_battery_charging) =
                              id(guesty_display_battery_charging);
                        }
                    - text_sensor.template.publish:
                        id: guesty_last_booking
                        state: !lambda |-
                          return booking_summary;
                  else:
                    - lambda: |-
                        if (id(guesty_border_conditioning_requested)) {
                          id(guesty_border_conditioning_revision) = 0;
                        }
                        id(guesty_border_conditioning_requested) = false;
                    - logger.log:
                        level: WARN
                        format: "E-paper refresh failed; booking confirmation was not published"
            else:
              # No panel refresh is needed, but restored globals (especially
              # the renewed privacy lease) need one scheduler cycle before
              # battery mode enters deep sleep. A matching persisted content
              # ID plus renderer revision proves this booking was drawn during
              # an earlier successful refresh.
              - text_sensor.template.publish:
                  id: guesty_last_booking
                  state: !lambda |-
                    return booking_summary;
              - lambda: |-
                  id(guesty_screen_sensitive) = mode != "idle";
                  id(guesty_valid_until_epoch) =
                      mode == "idle" ? 0 : valid_until_epoch;
                  id(guesty_privacy_clear_pending) = false;
              - delay: 1200ms
        # Re-read VBUS immediately before deciding the post-sync power state.
        # This keeps a newly connected cable online and sends a just-unplugged
        # device back to sleep without relying on a stale boot-time sample.
        - script.execute: guesty_read_external_power
        - script.wait: guesty_read_external_power
        - if:
            condition:
              lambda: |-
                const std::string profile = "${power_mode}";
                return (profile == "battery"
                    || (profile != "mains"
                        && (!id(guesty_external_power).has_state()
                            || !id(guesty_external_power).state)))
                    && !id(guesty_epaper).update_in_progress()
                    && !(id(guesty_privacy_clear_pending)
                        && id(guesty_screen_sensitive));
            then:
              - script.execute: guesty_enter_battery_sleep

# Deep-sleep displays must validate a freshly installed OTA image before a
# later network or wake-pin reset can trigger the ESP32 bootloader rollback.
# Ten seconds still preserves rollback for immediate boot failures while
# completing well before the shortest supported awake window (30 seconds).
safe_mode:
  boot_is_good_after: 10s

globals:
  # v10 delivery coordination is volatile and contains only a random opaque
  # call token plus neutral status. It is deliberately not written to flash.
  - id: guesty_delivery_handler_busy
    type: bool
    initial_value: "false"
  - id: guesty_delivery_result
    type: bool
    initial_value: "false"
  - id: guesty_delivery_unchanged
    type: bool
    initial_value: "false"
  - id: guesty_delivery_error
    type: std::string
    initial_value: '""'
  - id: guesty_active_delivery_id
    type: std::string
    initial_value: '""'
  - id: guesty_last_delivery_state
    type: std::string
    initial_value: '""'
  - id: guesty_mode
    type: std::string
    initial_value: '"idle"'
  - id: guesty_property_name
    type: std::string
    initial_value: '"UNTERKUNFT"'
  - id: guesty_welcome_title
    type: std::string
    initial_value: '"NÄCHSTE BUCHUNG"'
  - id: guesty_welcome_text
    type: std::string
    initial_value: '"Keine bevorstehende Buchung"'
  - id: guesty_door_code
    type: std::string
    initial_value: '""'
  - id: guesty_wifi_name
    type: std::string
    initial_value: '""'
  - id: guesty_wifi_password
    type: std::string
    initial_value: '""'
  - id: guesty_checkout_label
    type: std::string
    initial_value: '""'
  - id: guesty_door_code_label
    type: std::string
    initial_value: '"TÜRCODE"'
  - id: guesty_wifi_label
    type: std::string
    initial_value: '"WIFI"'
  - id: guesty_wifi_name_label
    type: std::string
    initial_value: '"Name:"'
  - id: guesty_wifi_key_label
    type: std::string
    initial_value: '"Key:"'
  # The neutral screen copy is non-sensitive and survives deep sleep so a
  # local privacy fallback keeps the display's configured language.
  - id: guesty_idle_title
    type: std::string
    restore_value: true
    max_restore_data_length: 48
    initial_value: '"NÄCHSTE BUCHUNG"'
  - id: guesty_idle_text
    type: std::string
    restore_value: true
    max_restore_data_length: 160
    initial_value: '"Keine bevorstehende Buchung"'
  - id: guesty_no_active_booking_label
    type: std::string
    restore_value: true
    max_restore_data_length: 64
    initial_value: '"Keine aktive Buchung"'
  - id: guesty_checkout_instructions_title
    type: std::string
    initial_value: '"CHECK-OUT"'
  - id: guesty_checkout_instructions
    type: std::string
    initial_value: '""'
  - id: guesty_next_booking_title
    type: std::string
    initial_value: '""'
  - id: guesty_next_booking_guest
    type: std::string
    initial_value: '""'
  - id: guesty_next_booking_period
    type: std::string
    initial_value: '""'
  - id: guesty_general_notes_label
    type: std::string
    initial_value: '"ALLGEMEINE NOTIZEN"'
  - id: guesty_general_notes
    type: std::string
    initial_value: '""'
  - id: guesty_cleaner_notes_label
    type: std::string
    initial_value: '"FÜR DIE REINIGUNG"'
  - id: guesty_cleaner_notes
    type: std::string
    initial_value: '""'
  - id: guesty_special_requests_label
    type: std::string
    initial_value: '"SONDERWÜNSCHE"'
  - id: guesty_special_requests
    type: std::string
    initial_value: '""'
  - id: guesty_logo_data
    type: std::string
    initial_value: '""'
  - id: guesty_weather_condition
    type: std::string
    initial_value: '""'
  - id: guesty_weather_temperature
    type: std::string
    initial_value: '""'
  - id: guesty_has_wifi
    type: bool
    initial_value: "false"
  - id: guesty_has_weather
    type: bool
    initial_value: "false"
  - id: guesty_content_changed
    type: bool
    initial_value: "true"
  # A failed physical refresh is not a delivery success, but retrying the same
  # already rendered framebuffer in a tight loop only wears and flashes the
  # E-paper. Keep one volatile attempted fingerprint until content changes, a
  # forced refresh is requested or the device reboots.
  - id: guesty_failed_content_id
    type: std::string
    initial_value: '""'
  - id: guesty_failed_content_suppressed
    type: bool
    initial_value: "false"
  - id: guesty_weather_only_changed
    type: bool
    initial_value: "false"
  - id: guesty_battery_only_changed
    type: bool
    initial_value: "false"
  - id: guesty_display_battery_percent
    type: int
    initial_value: "-1"
  - id: guesty_display_battery_charging
    type: bool
    initial_value: "false"
  # Persist only an opaque, reservation-salted display fingerprint. This lets
  # the device skip identical E-paper refreshes without storing credentials.
  - id: guesty_content_id
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  # The non-weather fingerprint lets a temperature or condition change use a
  # small differential update even after the ESP32 wakes from deep sleep.
  - id: guesty_base_content_id
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  # A changed renderer or panel driver must repaint once even when the Guesty
  # payload itself is identical. Increment the expected value above whenever
  # the visible rendering pipeline changes.
  - id: guesty_render_revision
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # A local tone-curve substitution is renderer state too. Persist only its
  # non-sensitive hundredth-step value so changing gray_gamma forces one full
  # repaint even when Home Assistant sends an identical content fingerprint.
  - id: guesty_rendered_gray_gamma_x100
    type: int
    restore_value: true
    initial_value: "-1"
  # The selected non-sensitive waveform profile changes the physical panel
  # result without changing payload pixels. Persist it separately so a local
  # profile change forces exactly one full repaint.
  - id: guesty_rendered_waveform_profile
    type: int
    restore_value: true
    initial_value: "-1"
  # Record whether the latest successful physical full refresh ended with the
  # proven border-conditioning cycle. A later unconditioned full refresh makes
  # this proof pending again; partial updates and unchanged payloads preserve it.
  - id: guesty_border_conditioning_revision
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: guesty_border_conditioning_requested
    type: bool
    initial_value: "false"
  # The empty-room battery widget is quantized to five-percent steps. Persist
  # only the last successfully drawn value so regular wake cycles can suppress
  # redundant panel activity while still updating the small header window.
  - id: guesty_rendered_battery_percent
    type: int
    restore_value: true
    initial_value: "-1"
  # The charging pictogram is visible state too. Retain only this neutral flag
  # so a later cable or charger-state transition can request one header update.
  - id: guesty_rendered_battery_charging
    type: bool
    restore_value: true
    initial_value: "false"
  # The renewable epoch changes on every Home Assistant poll and therefore
  # remains volatile to avoid periodic NVS writes. A reboot with a physically
  # sensitive screen and no renewed epoch is treated as an expired lease.
  - id: guesty_valid_until_epoch
    type: uint32_t
    initial_value: "0"
  # Only the conservative physical-screen flag, opaque fingerprints and
  # non-sensitive header status survive deep sleep. Door and WiFi credentials
  # are never written to flash.
  - id: guesty_screen_sensitive
    type: bool
    restore_value: true
    initial_value: "false"
  # Volatile distinction between the boot-time idle default and an idle image
  # that was requested but not yet confirmed by the physical panel.
  - id: guesty_privacy_clear_pending
    type: bool
    initial_value: "false"
  - id: guesty_update_received_this_boot
    type: bool
    initial_value: "false"
  # Volatile confidence counters for the revision-aware power detector.
  # E1001 v1.2 uses the identified SY6974B plus REG0A.BUS_GD. Once that part
  # has been observed during a boot, transient status failures must never
  # divert the board to the USB-UART fallback.
  - id: guesty_sy6974_detected
    type: bool
    restore_value: true
    initial_value: "false"
  - id: guesty_sy6974_seen_this_boot
    type: bool
    initial_value: "false"
  - id: guesty_sy6974_id_matches
    type: uint8_t
    initial_value: "0"
  - id: guesty_sy6974_status_reads
    type: uint8_t
    initial_value: "0"
  - id: guesty_sy6974_bus_good_reads
    type: uint8_t
    initial_value: "0"
  # REG08.CHRG_STAT exposes the v1.2 charger's state, while REG09 distinguishes
  # charge, battery and temperature faults. Three identical combined snapshots
  # are required before the public status or the effective 100% value changes.
  - id: guesty_sy6974_charge_status_candidate
    type: int
    initial_value: "-1"
  - id: guesty_sy6974_charge_status_reads
    type: uint8_t
    initial_value: "0"
  - id: guesty_sy6974_charge_status_matches
    type: uint8_t
    initial_value: "0"
  # -2=unsupported v1.0, -1=unavailable, 0=not charging, 1=pre-charge,
  # 2=fast charging, 3=complete, 4=charge fault, 5=battery fault,
  # 6=temperature-limited/faulted.
  - id: guesty_charge_status_code
    type: int
    initial_value: "-1"
  - id: guesty_charge_status_invalid_batches
    type: uint8_t
    initial_value: "0"
  - id: guesty_battery_level_refresh_requested
    type: bool
    initial_value: "false"
  # Keep only a neutral, volatile microphone lifecycle state. This makes a
  # failed capture start distinguishable from a quiet room without retaining
  # samples or exposing any audio-derived detail.
  - id: guesty_microphone_status_value
    type: std::string
    initial_value: '"waiting_for_power_detection"'
  # The initial power probe runs before the passive sound-level consumer has
  # registered its callback. Gate capture until the final on_boot stage and
  # bound automatic recovery attempts so a hardware fault cannot cause an
  # endless start loop while the device remains on external power.
  - id: guesty_component_setup_complete
    type: bool
    initial_value: "false"
  - id: guesty_microphone_start_attempts
    type: uint8_t
    initial_value: "0"
  # E1001 v1.0 has no readable charger status. Its CH340C bridge is powered
  # only by TYPEC_5V. Three sampled windows distinguish that driven TXD signal
  # from the pulled-down line of an unpowered bridge.
  - id: guesty_usb_uart_powered_windows
    type: uint8_t
    initial_value: "0"
  - id: guesty_usb_uart_unpowered_windows
    type: uint8_t
    initial_value: "0"
  - id: guesty_uart0_tx_quiesced
    type: bool
    initial_value: "false"
  - id: guesty_usb_uart_power_probe_ready
    type: bool
    initial_value: "false"
  - id: guesty_uart_logger_baud_rate
    type: uint32_t
    initial_value: "0"
  - id: guesty_uart0_restore_ok
    type: bool
    initial_value: "false"
  - id: guesty_uart0_restore_warning_active
    type: bool
    initial_value: "false"
  # A previously confirmed cable survives one failed measurement group. This
  # avoids sleeping on USB because of a transient I2C error while still
  # detecting an actual unplug within two 15-second checks.
  - id: guesty_external_power_invalid_batches
    type: uint8_t
    initial_value: "0"
  - id: guesty_power_detection_method_code
    type: uint8_t
    initial_value: "255"
  - id: guesty_power_detection_warning_active
    type: bool
    initial_value: "false"
  # The optional panel self-test is neutral and runs only on confirmed external
  # power. Save only opaque render state while its diagnostic page temporarily
  # replaces the current payload; no guest or access value is persisted here.
  - id: guesty_self_test_active
    type: bool
    initial_value: "false"
  - id: guesty_self_test_partial_phase
    type: bool
    initial_value: "false"
  - id: guesty_self_test_result
    type: std::string
    initial_value: '"idle"'
  - id: guesty_border_recovery_result
    type: std::string
    initial_value: '"idle"'
  - id: guesty_self_test_saved_content_id
    type: std::string
    initial_value: '""'
  - id: guesty_self_test_saved_base_content_id
    type: std::string
    initial_value: '""'
  - id: guesty_self_test_saved_render_revision
    type: uint32_t
    initial_value: "0"

script:
  # Pause only the physical UART0 console path (API log listeners keep
  # working), disconnect ESP TX from the USB-UART bridge and drive both sides
  # to defined levels. This prevents older CH340C lots from being phantom-
  # powered by an idle-high GPIO43 while USB is absent.
  - id: guesty_quiesce_uart0
    mode: single
    then:
      - lambda: |-
          auto *logger = esphome::logger::global_logger;
          const bool logger_uart0 = logger != nullptr
              && logger->get_uart() ==
                  esphome::logger::UART_SELECTION_UART0
              && logger->get_uart_num() == UART_NUM_0
              && uart_is_driver_installed(UART_NUM_0);
          if (!logger_uart0) {
            id(guesty_usb_uart_power_probe_ready) = false;
            return;
          }

          const uint32_t baud_rate = logger->get_baud_rate();
          if (baud_rate != 0) {
            if (id(guesty_uart_logger_baud_rate) == 0) {
              id(guesty_uart_logger_baud_rate) = baud_rate;
            }
            logger->set_baud_rate(0);
          }
          uart_wait_tx_done(UART_NUM_0, pdMS_TO_TICKS(20));

          bool ready = gpio_reset_pin(GPIO_NUM_43) == ESP_OK;
          ready = gpio_pullup_dis(GPIO_NUM_43) == ESP_OK && ready;
          ready = gpio_pulldown_dis(GPIO_NUM_43) == ESP_OK && ready;
          ready = gpio_set_level(GPIO_NUM_43, 0) == ESP_OK && ready;
          ready = gpio_set_direction(GPIO_NUM_43, GPIO_MODE_OUTPUT)
              == ESP_OK && ready;
          ready = gpio_set_level(GPIO_NUM_43, 0) == ESP_OK && ready;
          ready = gpio_input_enable(GPIO_NUM_44) == ESP_OK && ready;
          ready = gpio_pullup_dis(GPIO_NUM_44) == ESP_OK && ready;
          ready = gpio_pulldown_en(GPIO_NUM_44) == ESP_OK && ready;
          id(guesty_uart0_tx_quiesced) = ready;
          id(guesty_usb_uart_power_probe_ready) = ready;

  # Reattach the existing, still-configured UART0 driver. Never reinstall or
  # reconfigure it: ESPHome owns its buffers and baud configuration.
  - id: guesty_restore_uart0
    mode: single
    then:
      - lambda: |-
          id(guesty_uart0_restore_ok) = false;
          auto *logger = esphome::logger::global_logger;
          const bool can_restore = id(guesty_uart0_tx_quiesced)
              && id(guesty_uart_logger_baud_rate) != 0
              && logger != nullptr
              && logger->get_uart() ==
                  esphome::logger::UART_SELECTION_UART0
              && logger->get_uart_num() == UART_NUM_0
              && uart_is_driver_installed(UART_NUM_0);
          if (!can_restore) {
            return;
          }

          uart_wait_tx_done(UART_NUM_0, pdMS_TO_TICKS(20));
          const bool restored = uart_set_pin(
              UART_NUM_0, GPIO_NUM_43, GPIO_NUM_44,
              UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE) == ESP_OK;
          if (restored) {
            gpio_input_enable(GPIO_NUM_44);
            gpio_pullup_dis(GPIO_NUM_44);
            gpio_pulldown_dis(GPIO_NUM_44);
            id(guesty_uart0_tx_quiesced) = false;
            logger->set_baud_rate(id(guesty_uart_logger_baud_rate));
            id(guesty_uart0_restore_ok) = true;
            id(guesty_uart0_restore_warning_active) = false;
          } else if (!id(guesty_uart0_restore_warning_active)) {
            id(guesty_uart0_restore_warning_active) = true;
            ESP_LOGW("guesty_power",
                     "UART0 restore failed; API logging remains available");
          }

  # Keep credentials inside the QR component only for the synchronous
  # framebuffer build. ESPHome's component diagnostics print its current value,
  # so every caller resets it to the neutral placeholder immediately after
  # component.update has returned.
  - id: guesty_prepare_wifi_qr
    mode: restart
    then:
      - lambda: |-
          if (id(guesty_mode) != "welcome" || !id(guesty_has_wifi)) {
            id(guesty_wifi_qr).set_value("GuestyTerminal");
            return;
          }
          const auto escape_wifi = [](const std::string &input) {
            std::string escaped;
            escaped.reserve(input.size() + 8);
            for (const char character : input) {
              if (character == '\\' || character == ';'
                  || character == ',' || character == ':') {
                escaped.push_back('\\');
              }
              escaped.push_back(character);
            }
            return escaped;
          };
          const std::string security = id(guesty_wifi_password).empty()
              ? "nopass" : "WPA";
          id(guesty_wifi_qr).set_value(
              "WIFI:T:" + security
              + ";S:" + escape_wifi(id(guesty_wifi_name))
              + ";P:" + escape_wifi(id(guesty_wifi_password)) + ";;");

  # Page selection is volatile. Use one shared helper after the neutral panel
  # self-test so a welcome, checkout or empty-room payload is restored exactly
  # as it was before the diagnostic pattern.
  - id: guesty_restore_payload_page
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(guesty_mode) == "checkout";
          then:
            - display.page.show: guesty_checkout_page
          else:
            - if:
                condition:
                  lambda: return id(guesty_mode) == "welcome";
                then:
                  - display.page.show: guesty_welcome_page
                else:
                  - display.page.show: guesty_idle_page

  # Exercise one complete four-gray frame, one true differential header update
  # and a final payload restore. The test is intentionally unavailable on
  # battery and clears the retained content proof before touching the panel, so
  # an interrupted test can never make a later payload suppress a required
  # redraw.
  - id: guesty_run_panel_self_test
    mode: single
    then:
      - script.execute: guesty_read_external_power
      - script.wait: guesty_read_external_power
      - if:
          condition:
            lambda: |-
              const bool external_power =
                  id(guesty_external_power).has_state()
                  && id(guesty_external_power).state;
              return external_power
                  && !id(guesty_delivery_handler_busy)
                  && !id(guesty_self_test_active)
                  && !id(guesty_epaper).update_in_progress();
          then:
            - lambda: |-
                id(guesty_self_test_active) = true;
                id(guesty_self_test_partial_phase) = false;
                id(guesty_self_test_result) = "running";
                id(guesty_self_test_saved_content_id) = id(guesty_content_id);
                id(guesty_self_test_saved_base_content_id) =
                    id(guesty_base_content_id);
                id(guesty_self_test_saved_render_revision) =
                    id(guesty_render_revision);
                id(guesty_content_id).clear();
                id(guesty_base_content_id).clear();
                id(guesty_render_revision) = 0;
                // The diagnostic full pattern is intentionally unconditioned.
                // Treat the border as pending until the protected restore below.
                id(guesty_border_conditioning_revision) = 0;
            - text_sensor.template.publish:
                id: guesty_self_test_status
                state: "full_pattern"
            - display.page.show: guesty_self_test_page
            - component.update: guesty_epaper
            - wait_until:
                condition:
                  lambda: return !id(guesty_epaper).update_in_progress();
                timeout: 120s
            - if:
                condition:
                  lambda: |-
                    return !id(guesty_epaper).update_in_progress()
                        && id(guesty_epaper).last_update_successful();
                then:
                  - lambda: id(guesty_self_test_partial_phase) = true;
                  - text_sensor.template.publish:
                      id: guesty_self_test_status
                      state: "partial_pattern"
                  - lambda: id(guesty_epaper).request_partial_update();
                  - component.update: guesty_epaper
                  - wait_until:
                      condition:
                        lambda: return !id(guesty_epaper).update_in_progress();
                      timeout: 120s
                  - lambda: |-
                      const bool partial_passed =
                          !id(guesty_epaper).update_in_progress()
                          && id(guesty_epaper).last_update_successful()
                          && id(guesty_epaper).last_update_was_partial();
                      id(guesty_self_test_result) = partial_passed
                          ? "success" : "partial_failed";
                else:
                  - lambda: id(guesty_self_test_result) = "full_failed";
            - lambda: id(guesty_self_test_partial_phase) = false;
            - script.execute: guesty_restore_payload_page
            - script.wait: guesty_restore_payload_page
            - if:
                condition:
                  lambda: return !id(guesty_epaper).update_in_progress();
                then:
                  - text_sensor.template.publish:
                      id: guesty_self_test_status
                      state: "restoring"
                  - script.execute: guesty_prepare_wifi_qr
                  - script.wait: guesty_prepare_wifi_qr
                  - lambda: |-
                      id(guesty_epaper).request_border_recovery();
                      id(guesty_border_conditioning_requested) = true;
                  - component.update: guesty_epaper
                  - lambda: |-
                      id(guesty_wifi_qr).set_value("GuestyTerminal");
                  - wait_until:
                      condition:
                        lambda: return !id(guesty_epaper).update_in_progress();
                      timeout: 120s
                  - if:
                      condition:
                        lambda: |-
                          return !id(guesty_epaper).update_in_progress()
                              && id(guesty_epaper).last_update_successful();
                      then:
                        - lambda: |-
                            id(guesty_content_id) =
                                id(guesty_self_test_saved_content_id);
                            id(guesty_base_content_id) =
                                id(guesty_self_test_saved_base_content_id);
                            id(guesty_render_revision) =
                                id(guesty_self_test_saved_render_revision);
                            id(guesty_border_conditioning_revision) = 1;
                            id(guesty_border_conditioning_requested) = false;
                      else:
                        - lambda: |-
                            id(guesty_self_test_result) = "restore_failed";
                            id(guesty_border_conditioning_revision) = 0;
                            id(guesty_border_conditioning_requested) = false;
                else:
                  - lambda: |-
                      id(guesty_self_test_result) = "hardware_timeout";
                      id(guesty_border_conditioning_revision) = 0;
                      id(guesty_border_conditioning_requested) = false;
            - lambda: |-
                id(guesty_self_test_active) = false;
                id(guesty_self_test_saved_content_id).clear();
                id(guesty_self_test_saved_base_content_id).clear();
            - text_sensor.template.publish:
                id: guesty_self_test_status
                state: !lambda return id(guesty_self_test_result);
            - component.update: guesty_panel_phase
            - component.update: guesty_panel_error
            - component.update: guesty_waveform_mode
            - component.update: guesty_border_mode
          else:
            - text_sensor.template.publish:
                id: guesty_self_test_status
                state: !lambda |-
                  const bool external_power =
                      id(guesty_external_power).has_state()
                      && id(guesty_external_power).state;
                  return external_power ? "busy" : "requires_external_power";

  # The former ESPHome 7.50inv2 path drew this panel without the visible border.
  # Run its independently reimplemented UC8179 monochrome OTP register mode as
  # one conditioning pass, then immediately redraw the untouched
  # four-gray framebuffer with the selected pixel waveform and a high-Z border.
  # This diagnostic is external-power-only and never changes content proofs.
  # Normal content-changing full refreshes use the same bounded sequence; an
  # already-proven unchanged frame remains completely suppressed.
  - id: guesty_run_border_recovery
    mode: single
    then:
      - script.execute: guesty_read_external_power
      - script.wait: guesty_read_external_power
      - if:
          condition:
            lambda: |-
              const bool external_power =
                  id(guesty_external_power).has_state()
                  && id(guesty_external_power).state;
              return external_power
                  && !id(guesty_delivery_handler_busy)
                  && !id(guesty_self_test_active)
                  && !id(guesty_epaper).update_in_progress();
          then:
            - lambda: |-
                id(guesty_self_test_active) = true;
                id(guesty_border_recovery_result) = "running";
            - text_sensor.template.publish:
                id: guesty_border_recovery_status
                state: "running"
            - script.execute: guesty_restore_payload_page
            - script.wait: guesty_restore_payload_page
            - script.execute: guesty_prepare_wifi_qr
            - script.wait: guesty_prepare_wifi_qr
            - lambda: id(guesty_epaper).request_border_recovery();
            - component.update: guesty_epaper
            - lambda: id(guesty_wifi_qr).set_value("GuestyTerminal");
            - wait_until:
                condition:
                  lambda: return !id(guesty_epaper).update_in_progress();
                timeout: 120s
            - lambda: |-
                if (id(guesty_epaper).update_in_progress()) {
                  id(guesty_border_recovery_result) = "hardware_timeout";
                  id(guesty_border_conditioning_revision) = 0;
                } else if (id(guesty_epaper).last_update_successful()) {
                  id(guesty_border_recovery_result) = "success";
                  id(guesty_border_conditioning_revision) = 1;
                } else {
                  id(guesty_border_recovery_result) = "failed";
                  id(guesty_border_conditioning_revision) = 0;
                }
                id(guesty_self_test_active) = false;
            - text_sensor.template.publish:
                id: guesty_border_recovery_status
                state: !lambda return id(guesty_border_recovery_result);
            - component.update: guesty_panel_phase
            - component.update: guesty_panel_error
            - component.update: guesty_waveform_mode
            - component.update: guesty_border_mode
          else:
            - text_sensor.template.publish:
                id: guesty_border_recovery_status
                state: !lambda |-
                  const bool external_power =
                      id(guesty_external_power).has_state()
                      && id(guesty_external_power).state;
                  return external_power ? "busy" : "requires_external_power";

  # GPIO38 powers the PDM microphone only after a physical cable has been
  # confirmed. Wait for ESPHome's I2S task to report RUNNING so a failed start
  # no longer looks identical to a merely quiet 30-second measurement window.
  - id: guesty_start_microphone
    mode: restart
    then:
      - script.stop: guesty_verify_microphone_window
      - lambda: |-
          if (id(guesty_microphone_start_attempts) < 255) {
            id(guesty_microphone_start_attempts)++;
          }
          id(guesty_microphone_status_value) = "starting";
          // A reconnect must prove a new complete window instead of reusing
          // the last finite value from the previous cable session.
          id(guesty_sound_level_30_seconds).publish_state(NAN);
          ESP_LOGI("guesty_microphone",
                   "Starting PDM capture after component setup (attempt %u/3)",
                   static_cast<unsigned>(id(guesty_microphone_start_attempts)));
      - component.update: guesty_microphone_status
      - output.turn_on: guesty_microphone_power
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: guesty_external_power
          then:
            - microphone.capture: guesty_microphone
            - wait_until:
                condition:
                  lambda: |-
                    return id(guesty_microphone).is_running()
                        || id(guesty_microphone).is_failed();
                timeout: 5s
            - if:
                condition:
                  lambda: return id(guesty_microphone).is_running();
                then:
                  - lambda: |-
                      id(guesty_microphone_status_value) =
                          "waiting_for_first_window";
                      ESP_LOGI("guesty_microphone",
                               "PDM capture reached the running state");
                  - component.update: guesty_microphone_status
                  - script.execute: guesty_verify_microphone_window
                else:
                  - microphone.stop_capture: guesty_microphone
                  - wait_until:
                      condition:
                        lambda: return id(guesty_microphone).is_stopped();
                      timeout: 500ms
                  - output.turn_off: guesty_microphone_power
                  - lambda: |-
                      id(guesty_microphone_status_value) =
                          id(guesty_microphone).is_failed()
                              ? "initialization_failed"
                              : "capture_start_timeout";
                      ESP_LOGW("guesty_microphone",
                               "PDM capture did not reach the running state");
                  - component.update: guesty_microphone_status
          else:
            - output.turn_off: guesty_microphone_power
            - lambda: id(guesty_microphone_status_value) = "off_on_battery";
            - component.update: guesty_microphone_status

  # A running I2S task alone does not prove that the selected PDM slot yields
  # usable samples. After one complete window plus margin, report a neutral
  # diagnostic if the RMS value is still non-finite. A later valid value
  # automatically changes the state to running through the sensor callback.
  - id: guesty_verify_microphone_window
    mode: restart
    then:
      - delay: 40s
      - if:
          condition:
            lambda: |-
              return id(guesty_external_power).has_state()
                  && id(guesty_external_power).state
                  && id(guesty_microphone).is_running();
          then:
            - lambda: |-
                const bool valid_rms =
                    id(guesty_sound_level_30_seconds).has_state()
                    && std::isfinite(id(guesty_sound_level_30_seconds).state);
                id(guesty_microphone_status_value) = valid_rms
                    ? "running" : "no_valid_rms_value";
                if (!valid_rms) {
                  ESP_LOGW("guesty_microphone",
                           "PDM capture produced no finite 30-second RMS value");
                } else {
                  ESP_LOGI("guesty_microphone",
                           "PDM capture produced its first finite RMS value");
                }
            - component.update: guesty_microphone_status

  # Keep every battery sleep entry identical. Publishing the actual awake time
  # before shutdown makes failed delivery, wake loops and exhausted timeout
  # windows visible in Home Assistant without retaining another flash value.
  - id: guesty_enter_battery_sleep
    mode: single
    then:
      - output.turn_off: guesty_battery_enable
      - output.turn_off: guesty_status_led
      - output.turn_off: guesty_buzzer
      - script.stop: guesty_start_microphone
      - script.stop: guesty_verify_microphone_window
      - microphone.stop_capture: guesty_microphone
      - wait_until:
          condition:
            lambda: return id(guesty_microphone).is_stopped();
          timeout: 500ms
      - output.turn_off: guesty_microphone_power
      - lambda: id(guesty_microphone_status_value) = "off_on_battery";
      - component.update: guesty_microphone_status
      - output.turn_off: guesty_sd_power
      - component.update: guesty_awake_duration
      - delay: 300ms
      # Leave the USB-UART bridge electrically quiet on every sleep path,
      # including explicit battery mode on otherwise externally powered units.
      - script.execute: guesty_quiesce_uart0
      - script.wait: guesty_quiesce_uart0
      - delay: 60ms
      # ESPHome 2026.7 and earlier do not count an orderly deep-sleep entry as
      # a successful OTA boot. Mark it explicitly so short battery wake cycles
      # do not roll back working firmware.
      - safe_mode.mark_successful
      - deep_sleep.enter: guesty_deep_sleep
  - id: guesty_read_external_power
    # Concurrent callers share the running observation instead of cancelling
    # it or queueing a stale second cable decision.
    mode: single
    then:
      - lambda: |-
          id(guesty_sy6974_id_matches) = 0;
          id(guesty_sy6974_status_reads) = 0;
          id(guesty_sy6974_bus_good_reads) = 0;
          id(guesty_sy6974_charge_status_candidate) = -1;
          id(guesty_sy6974_charge_status_reads) = 0;
          id(guesty_sy6974_charge_status_matches) = 0;
          id(guesty_battery_level_refresh_requested) = false;
          id(guesty_usb_uart_powered_windows) = 0;
          id(guesty_usb_uart_unpowered_windows) = 0;
          id(guesty_usb_uart_power_probe_ready) = false;
          id(guesty_uart0_restore_ok) = false;
      # Quiesce first on both revisions. The USB-UART bridge exists on each,
      # and a total charger-bus failure must not leave a phantom-powered path.
      - script.execute: guesty_quiesce_uart0
      - script.wait: guesty_quiesce_uart0
      - delay: 60ms
      - repeat:
          count: 3
          then:
            - lambda: |-
                // First identify the v1.2 charger. This prevents an unrelated
                // device at 0x6B from being accepted on an older board.
                uint8_t reg = 0x0B;
                uint8_t part_id = 0;
                const auto id_error = id(guesty_power_i2c)->write_readv(
                    0x6B, &reg, 1, &part_id, 1);
                if (id_error == esphome::i2c::ERROR_OK
                    && (part_id & 0x78) == 0x40) {
                  id(guesty_sy6974_seen_this_boot) = true;
                  id(guesty_sy6974_id_matches)++;
                }

                // A known v1.2 board still gets a status read when the part-ID
                // read in this iteration glitches. Otherwise one I2C error
                // would incorrectly make the modern observation incomplete.
                if (id(guesty_sy6974_detected)
                    || id(guesty_sy6974_seen_this_boot)) {
                  // REG0A.BUS_GD is independent of the BC1.2 source class in
                  // REG08 and therefore includes every valid USB adapter.
                  reg = 0x0A;
                  uint8_t status = 0;
                  const auto status_error =
                      id(guesty_power_i2c)->write_readv(
                          0x6B, &reg, 1, &status, 1);
                  if (status_error == esphome::i2c::ERROR_OK) {
                    id(guesty_sy6974_status_reads)++;
                    if ((status & 0x80) != 0) {
                      id(guesty_sy6974_bus_good_reads)++;
                    }
                  }

                  // The charger does not expose voltage or a fuel-gauge SOC,
                  // but REG08 and REG09 provide an authoritative charge phase
                  // and bounded fault classification on E1001 v1.2.
                  reg = 0x08;
                  uint8_t charge_status = 0;
                  const auto charge_error =
                      id(guesty_power_i2c)->write_readv(
                          0x6B, &reg, 1, &charge_status, 1);
                  reg = 0x09;
                  uint8_t fault_status = 0;
                  const auto fault_error =
                      id(guesty_power_i2c)->write_readv(
                          0x6B, &reg, 1, &fault_status, 1);
                  if (charge_error == esphome::i2c::ERROR_OK
                      && fault_error == esphome::i2c::ERROR_OK) {
                    int charge_code =
                        static_cast<int>((charge_status >> 3) & 0x03);
                    if ((fault_status & 0x08) != 0) {
                      charge_code = 5;  // battery over-voltage
                    } else if ((fault_status & 0x07) != 0) {
                      charge_code = 6;  // NTC limited/cold/hot
                    } else if ((fault_status & 0x30) != 0) {
                      charge_code = 4;  // input, thermal or safety-timer fault
                    }
                    id(guesty_sy6974_charge_status_reads)++;
                    if (id(guesty_sy6974_charge_status_candidate)
                            == charge_code) {
                      id(guesty_sy6974_charge_status_matches)++;
                    } else {
                      id(guesty_sy6974_charge_status_candidate) = charge_code;
                      id(guesty_sy6974_charge_status_matches) = 1;
                    }
                  }
                }
            - delay: 25ms
      - lambda: |-
          if (!id(guesty_sy6974_detected)
              && id(guesty_sy6974_id_matches) == 3) {
            // The hardware revision is stable. Persist this one non-sensitive
            // fact so later deep-sleep boots never enter the legacy path only
            // because the charger bus is temporarily unavailable.
            id(guesty_sy6974_detected) = true;
          }
      - if:
          condition:
            lambda: |-
              return !id(guesty_sy6974_detected)
                  && !id(guesty_sy6974_seen_this_boot);
          then:
            # E1001 v1.0 has no readable VBUS register. GPIO43 has already
            # been low for more than WCH's maximum reset interval, and the
            # GPIO44 pull-down remains active throughout all sample windows.
            - repeat:
                count: 3
                then:
                  - lambda: |-
                      if (!id(guesty_usb_uart_power_probe_ready)) {
                        return;
                      }
                      uint8_t high_samples = 0;
                      for (uint8_t sample = 0; sample < 64; sample++) {
                        if (gpio_get_level(GPIO_NUM_44) != 0) {
                          high_samples++;
                        }
                        // Avoid repeatedly sampling the same UART bit phase.
                        delayMicroseconds(113 + ((sample * 17) % 31));
                      }
                      if (high_samples >= 4) {
                        id(guesty_usb_uart_powered_windows)++;
                      } else if (high_samples == 0) {
                        id(guesty_usb_uart_unpowered_windows)++;
                      }
                  - delay: 7ms
      # Restore serial output only when a raw signal proves that the bridge is
      # powered. ABSENT and UNKNOWN leave GPIO43 low until the next probe or
      # deep sleep.
      - if:
          condition:
            lambda: |-
              const bool modern_external =
                  (id(guesty_sy6974_detected)
                      || id(guesty_sy6974_seen_this_boot))
                  && id(guesty_sy6974_status_reads) == 3
                  && id(guesty_sy6974_bus_good_reads) == 3;
              const bool legacy_external =
                  !id(guesty_sy6974_detected)
                  && !id(guesty_sy6974_seen_this_boot)
                  && id(guesty_usb_uart_power_probe_ready)
                  && id(guesty_usb_uart_powered_windows) == 3;
              return modern_external || legacy_external;
          then:
            - script.execute: guesty_restore_uart0
            - script.wait: guesty_restore_uart0
      - lambda: |-
          bool measurement_valid = false;
          bool external_power = false;
          uint8_t method_code = 0;  // unavailable

          if ((id(guesty_sy6974_detected)
                  || id(guesty_sy6974_seen_this_boot))
              && id(guesty_sy6974_status_reads) == 3) {
            // A fully readable v1.2 charger is authoritative. A mixed BUS_GD
            // batch represents a cable transition and remains unresolved.
            if (id(guesty_sy6974_bus_good_reads) == 3) {
              measurement_valid = true;
              external_power = true;
              method_code = 1;  // SY6974B BUS_GD
            } else if (id(guesty_sy6974_bus_good_reads) == 0) {
              measurement_valid = true;
              external_power = false;
              method_code = 1;
            }
          } else if (!id(guesty_sy6974_detected)
                     && !id(guesty_sy6974_seen_this_boot)
                     && id(guesty_usb_uart_power_probe_ready)) {
            // No identified v1.2 charger means the official v1.0 CH340C path
            // is the only software-readable indication of TYPEC_5V. Three
            // consistent sample windows are required in either direction.
            if (id(guesty_usb_uart_powered_windows) == 3) {
              measurement_valid = true;
              external_power = true;
              method_code = 2;  // USB-UART
            } else if (id(guesty_usb_uart_unpowered_windows) == 3) {
              measurement_valid = true;
              external_power = false;
              method_code = 2;
            }
          }

          const bool modern_charger = id(guesty_sy6974_detected)
              || id(guesty_sy6974_seen_this_boot);
          int next_charge_status = id(guesty_charge_status_code);
          if (modern_charger) {
            const bool stable_charge_status =
                id(guesty_sy6974_charge_status_reads) == 3
                && id(guesty_sy6974_charge_status_matches) == 3;
            if (stable_charge_status) {
              id(guesty_charge_status_invalid_batches) = 0;
              next_charge_status =
                  id(guesty_sy6974_charge_status_candidate);
            } else {
              if (id(guesty_charge_status_invalid_batches) < 2) {
                id(guesty_charge_status_invalid_batches)++;
              }
              if (id(guesty_charge_status_invalid_batches) >= 2) {
                next_charge_status = -1;  // unavailable
              }
            }
          } else {
            id(guesty_charge_status_invalid_batches) = 0;
            next_charge_status = -2;  // unsupported on E1001 v1.0
          }

          if (next_charge_status != id(guesty_charge_status_code)) {
            id(guesty_charge_status_code) = next_charge_status;
            const char *charge_state = "unavailable";
            switch (next_charge_status) {
              case -2: charge_state = "unsupported"; break;
              case 0: charge_state = "not_charging"; break;
              case 1: charge_state = "pre_charge"; break;
              case 2: charge_state = "fast_charging"; break;
              case 3: charge_state = "complete"; break;
              case 4: charge_state = "charge_fault"; break;
              case 5: charge_state = "battery_fault"; break;
              case 6: charge_state = "temperature_limited"; break;
              default: break;
            }
            id(guesty_charging_status).publish_state(charge_state);
            id(guesty_battery_level_refresh_requested) = true;
          }

          if (measurement_valid) {
            id(guesty_external_power_invalid_batches) = 0;
            id(guesty_power_detection_warning_active) = false;
            if (id(guesty_power_detection_method_code) != method_code) {
              id(guesty_power_detection_method_code) = method_code;
              const char *method = method_code == 1
                  ? "SY6974B BUS_GD" : "USB-UART";
              id(guesty_power_detection_method).publish_state(method);
              ESP_LOGI("guesty_power", "Power detection method: %s", method);
            }
            if (!id(guesty_external_power).has_state()
                || id(guesty_external_power).state != external_power) {
              // The effective 100% endpoint is valid only while BUS_GD is
              // confirmed. Re-evaluate immediately on either cable edge even
              // when CHRG_STAT itself has not changed yet.
              id(guesty_battery_level_refresh_requested) = true;
              id(guesty_external_power).publish_state(external_power);
            }
            return;
          }

          if (id(guesty_power_detection_method_code) != 0) {
            id(guesty_power_detection_method_code) = 0;
            id(guesty_power_detection_method).publish_state("Unavailable");
          }
          if (id(guesty_external_power_invalid_batches) < 2) {
            id(guesty_external_power_invalid_batches)++;
          }
          const bool was_confirmed =
              id(guesty_external_power).has_state()
              && id(guesty_external_power).state;
          if (!was_confirmed
              || id(guesty_external_power_invalid_batches) >= 2) {
            if (!id(guesty_external_power).has_state()
                || id(guesty_external_power).state) {
              id(guesty_external_power).publish_state(false);
            }
          }
          if (id(guesty_external_power_invalid_batches) >= 2
              && !id(guesty_power_detection_warning_active)) {
            id(guesty_power_detection_warning_active) = true;
            ESP_LOGW("guesty_power",
                     "External power detection unavailable; using battery behavior");
          }
      - if:
          condition:
            lambda: return id(guesty_battery_level_refresh_requested);
          then:
            - component.update: guesty_battery_level
            - lambda: id(guesty_battery_level_refresh_requested) = false;

