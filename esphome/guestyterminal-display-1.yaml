substitutions:
  device_name: guestyterminal-display-1
  friendly_name: GuestyTerminal Display 1
  power_mode: auto
  battery_sleep_duration: 30min
  awake_duration_seconds: "90"

external_components:
  - source:
      type: local
      path: components
    components:
      - guesty_epaper_gray4

packages:
  guesty_terminal: !include packages/reterminal-e1001-guesty-terminal.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: guestyterminal.reterminal-e1001
    version: "0.3.3"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:
